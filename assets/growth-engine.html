<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Board V10 — Personal Strategy OS</title>
<style>
:root{
  --bg:#06090e;--surf:#0c1219;--surf2:#121a24;--line:#1a2533;
  --tx:#c8d5e0;--dim:#6a8094;--mute:#3d4f60;
  --blue:#39bae6;--blue-d:rgba(57,186,230,.12);--blue-b:rgba(57,186,230,.35);
  --green:#b8d94c;--green-d:rgba(184,217,76,.12);--green-b:rgba(184,217,76,.35);
  --amber:#ffb454;--amber-d:rgba(255,180,84,.12);--amber-b:rgba(255,180,84,.4);
  --purple:#c9a0ff;--purple-d:rgba(201,160,255,.12);--purple-b:rgba(201,160,255,.35);
  --red:#ff8f40;--red-d:rgba(255,143,64,.12);--red-b:rgba(255,143,64,.4);
  --mono:'Space Mono','SF Mono',Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding:0 0 60px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* TOP BAR */
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surf);position:sticky;top:0;z-index:40}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--mono);font-size:13px;letter-spacing:2.5px;color:var(--blue)}
.brand .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px}
.top-right{display:flex;align-items:center;gap:16px}
.mom-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--green-b);background:var(--green-d);border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--green)}
.mom-chip.down{border-color:var(--red-b);background:var(--red-d);color:var(--red)}
.mom-chip.flat{border-color:var(--amber-b);background:var(--amber-d);color:var(--amber)}
.sync{font-family:var(--mono);font-size:10px;color:var(--dim)}
.back{font-size:11px;color:var(--dim);border:1px solid var(--line);padding:5px 10px;border-radius:4px}
.back:hover{color:var(--blue);border-color:var(--blue)}

/* MODE NAV */
.modes{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--surf);padding:0 14px;overflow-x:auto}
.mode{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;padding:10px 14px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.mode:hover{color:var(--tx)}
.mode.on{color:var(--blue);border-bottom-color:var(--blue)}

/* SHELL */
.shell{max-width:1280px;margin:0 auto;padding:18px 18px 0}
.hierarchy{display:flex;gap:0;flex-wrap:nowrap;margin-bottom:18px;align-items:center;overflow-x:auto}
.spine-step{display:flex;align-items:center;gap:0}
.spine-node{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;color:var(--blue);border:1px solid var(--blue-b);background:var(--blue-d);padding:6px 10px;border-radius:999px;white-space:nowrap}
.spine-edge{width:36px;height:2px;background:linear-gradient(90deg,var(--blue-b),var(--mute));position:relative}
.spine-edge:after{content:'';position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--mute)}
.hierarchy span{display:none}

/* POSITION MINDMAP */
.mmap{position:relative;height:460px;background:radial-gradient(ellipse at 50% 48%,rgba(57,186,230,.07),transparent 58%),var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px}
.mmap svg.wires{position:absolute;inset:0;width:100%;height:100%}
.mmap-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:168px;min-height:88px;padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--blue);box-shadow:0 0 0 6px var(--blue-d),0 18px 40px rgba(0,0,0,.45);text-align:center;z-index:3}
.mmap-hub .k{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--blue);margin-bottom:6px}
.mmap-hub .v{font-size:12px;line-height:1.35;color:#eaf6fc;font-weight:600}
.mmap-node{position:absolute;width:168px;padding:10px 11px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mmap-node.up{border-color:var(--green-b)}
.mmap-node.stable{border-color:var(--amber-b)}
.mmap-node.down{border-color:var(--red-b)}
.mmap-node .lab{font-family:var(--mono);font-size:9px;letter-spacing:1px;margin-bottom:3px}
.mmap-node.up .lab,.mmap-node.up .dir{color:var(--green)}
.mmap-node.stable .lab,.mmap-node.stable .dir{color:var(--amber)}
.mmap-node.down .lab,.mmap-node.down .dir{color:var(--red)}
.mmap-node .dir{font-family:var(--mono);font-size:12px;font-weight:700}
.mmap-node .meta{font-size:10px;color:var(--dim);line-height:1.4;margin-top:5px}
.mmap-node .meta b{color:var(--tx);font-weight:500}

/* AFTER-MOVE FLOWCHART */
.flowbox{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;flex:1;display:flex;flex-direction:column}
.flowbox h3{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:8px}
.flow-svg{width:100%;height:248px;display:block}
.flow-svg .box{fill:var(--surf2);stroke:var(--line)}
.flow-svg .box.cur{stroke:#3d4f60}
.flow-svg .box.next{fill:rgba(57,186,230,.12);stroke:var(--blue)}
.flow-svg .box.fork{fill:rgba(201,160,255,.08);stroke:var(--purple-b)}
.flow-svg text{font-family:var(--mono);fill:var(--tx)}
.flow-svg .lbl{font-size:9px;letter-spacing:1px;fill:var(--dim)}
.flow-svg .ttl{font-size:11px;font-weight:700;fill:#eaf6fc}
.flow-svg .sub{font-size:10px;fill:var(--dim)}
.flow-svg .arr{stroke:var(--blue);stroke-width:1.6;fill:none;marker-end:url(#arr)}
.flow-svg .arr2{stroke:var(--purple);stroke-width:1.2;fill:none;marker-end:url(#arrp)}

/* PARALLEL PIPELINE */
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;margin-top:4px}
@media(max-width:1000px){.pipe{grid-template-columns:1fr}}
.pipe-col{background:var(--surf);border:1px solid var(--line);padding:10px 10px 12px;min-height:160px;position:relative}
.pipe-col + .pipe-col{border-left:none}
.pipe-col:first-child{border-radius:10px 0 0 10px}
.pipe-col:last-child{border-radius:0 10px 10px 0}
.pipe-col h4{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;margin-bottom:8px}
.pipe-col.ACTIVE h4{color:var(--blue)}.pipe-col.PASSIVE h4{color:var(--amber)}
.pipe-col.SETUP h4{color:var(--green)}.pipe-col.OPTIONALITY h4{color:var(--purple)}.pipe-col.WATCH h4{color:var(--dim)}
.pipe-arrow{position:absolute;right:-7px;top:18px;z-index:2;color:var(--mute);font-size:14px}
@media(max-width:1000px){.pipe-col + .pipe-col{border-left:1px solid var(--line);border-top:none}.pipe-col:first-child,.pipe-col:last-child{border-radius:10px}.pipe-arrow{display:none}}

/* CAMPAIGN TREES */
.ctree-g{display:grid;grid-template-columns:1fr;gap:14px}
.ctree{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px}
.ctree .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ctree .name{font-size:15px;font-weight:700}
.ctree svg{width:100%;height:220px;display:block}
.ctree .note{font-size:11px;color:var(--dim);line-height:1.45;padding:6px 2px 8px}

/* COUNCIL RADIAL */
.crad{position:relative;height:460px;background:radial-gradient(circle at 50% 50%,rgba(184,217,76,.06),transparent 55%),var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0 14px}
.crad svg.wires{position:absolute;inset:0;width:100%;height:100%}
.crad-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--green);box-shadow:0 0 0 6px var(--green-d);z-index:3;text-align:center}
.crad-hub .k{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--green);margin-bottom:6px}
.crad-hub .v{font-size:12px;line-height:1.4;font-weight:600;color:#eaf6fc}
.crad-node{position:absolute;width:176px;padding:9px 10px;border-radius:10px;background:var(--surf2);border:1px solid var(--line);z-index:2}
.crad-node.rt{border-color:var(--red-b)}
.crad-node .role{font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--dim);margin-bottom:3px}
.crad-node .fav{font-size:11px;font-weight:600;color:var(--blue);line-height:1.3}

@media (prefers-reduced-motion:reduce){
  .drawer{animation:none}
}

/* DELTA STRIP */
.delta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:10px 12px;background:var(--surf);border:1px solid var(--line);border-radius:8px;font-size:11px}
.delta .lab{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--dim);margin-right:4px}
.delta .i{padding:2px 8px;border-radius:4px;background:var(--surf2);border:1px solid var(--line)}
.delta .i.plus{border-color:var(--green-b);color:var(--green)}
.delta .i.warn{border-color:var(--red-b);color:var(--red)}
.delta .i.same{color:var(--dim)}

/* SECTION */
.sec{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;color:var(--dim);text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec:before,.sec:after{content:'';height:1px;background:var(--line)}
.sec:before{width:14px}.sec:after{flex:1}

/* MOMENTUM PANEL */
.mom-panel{display:grid;grid-template-columns:200px 1fr;gap:12px;margin-bottom:8px}
@media(max-width:700px){.mom-panel{grid-template-columns:1fr}}
.mom-big{background:var(--surf);border:1px solid var(--green-b);border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.mom-big .k{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:6px}
.mom-big .v{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--green);letter-spacing:1px}
.mom-big .s{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.4}
.mom-sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.sig{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.4}
.sig .t{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);margin-bottom:4px}

/* DOMAIN NODES */
.domains{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}
@media(max-width:1000px){.domains{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.domains{grid-template-columns:repeat(2,1fr)}}
.dom{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:128px;position:relative;overflow:hidden}
.dom .fill{position:absolute;left:0;right:0;bottom:0;opacity:.14}
.dom.up .fill{background:var(--green)}.dom.up{border-color:var(--green-b)}
.dom.stable .fill{background:var(--amber)}.dom.stable{border-color:var(--amber-b)}
.dom.down .fill{background:var(--red)}.dom.down{border-color:var(--red-b)}
.dom .lab{font-family:var(--mono);font-size:10px;letter-spacing:1px;position:relative;z-index:1}
.dom .dir{font-family:var(--mono);font-size:16px;font-weight:700;margin:4px 0 2px;position:relative;z-index:1}
.dom.up .dir,.dom.up .lab{color:var(--green)}
.dom.stable .dir,.dom.stable .lab{color:var(--amber)}
.dom.down .dir,.dom.down .lab{color:var(--red)}
.dom .st{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);position:relative;z-index:1}
.dom .meta{font-size:10px;color:var(--dim);margin-top:8px;line-height:1.45;position:relative;z-index:1}
.dom .meta b{color:var(--tx);font-weight:500}
.pos-sum{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.55;margin-bottom:4px}
.pos-sum strong{color:var(--blue);font-weight:600}

/* HERO ROW: PRIMARY + AFTER */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-top:6px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}

/* PRIMARY MOVE — dominates */
.primary{background:linear-gradient(160deg,rgba(57,186,230,.16),var(--surf) 42%);border:1px solid var(--blue);border-radius:14px;padding:20px 22px;box-shadow:0 0 0 1px rgba(57,186,230,.08),0 16px 48px rgba(0,0,0,.4)}
.primary .tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--blue);margin-bottom:8px}
.primary h2{font-size:20px;font-weight:700;line-height:1.3;color:#eaf6fc;margin-bottom:6px}
.primary .obj{font-size:12px;color:var(--dim);margin-bottom:14px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:14px}
@media(max-width:600px){.pg{grid-template-columns:1fr}}
.pf .k{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--dim);margin-bottom:3px}
.pf .v{font-size:13px;line-height:1.45}
.lev{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--purple-b);color:var(--purple);background:var(--purple-d)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:1px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surf2);color:var(--tx)}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.go{background:var(--blue);border-color:var(--blue);color:#041018;font-weight:700}
.btn.go:hover{filter:brightness(1.08);color:#041018}
.btn.warn{border-color:var(--amber-b);color:var(--amber)}
.execute-box{margin-top:12px;padding:12px 14px;background:var(--blue-d);border:1px solid var(--blue-b);border-radius:10px}
.execute-box .k{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--blue);margin-bottom:6px}
.execute-box .v{font-size:13px;line-height:1.5;color:#eaf6fc}
.execute-box .done{font-size:11px;color:var(--dim);margin-top:8px}
.stop{font-family:var(--mono);font-size:11px;color:var(--red);margin-top:10px}

/* POSITION AFTER */
.after{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column}
.after h3{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:12px}
.tree-viz{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:4px 0 10px}
.node{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surf2);font-size:12px}
.node.cur{border-color:var(--mute);color:var(--dim)}
.node.next{border-color:var(--blue);background:var(--blue-d);color:var(--blue);font-weight:600}
.vline{width:2px;height:14px;background:var(--line);margin-left:18px}
.vline.blue{background:var(--blue)}
.branch{margin-left:18px;border-left:2px solid var(--line);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.branch .b{font-size:11px;color:var(--dim);padding:4px 8px;border:1px dashed var(--line);border-radius:6px}
.branch .b b{color:var(--tx);font-weight:500}
.effects{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.eff{padding:8px;border-radius:6px;background:rgba(0,0,0,.25);font-size:11px;line-height:1.45}
.eff b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);margin-bottom:4px}
.eff.open{border-left:2px solid var(--green)}
.eff.close{border-left:2px solid var(--red)}
.eff.info{border-left:2px solid var(--blue)}
.eff.risk{border-left:2px solid var(--amber)}

/* PARALLEL LANES */
.lanes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:1000px){.lanes{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.lanes{grid-template-columns:1fr 1fr}}
.lane{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:140px}
.lane h4{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lane.ACTIVE h4{color:var(--blue)}.lane.PASSIVE h4{color:var(--amber)}
.lane.SETUP h4{color:var(--green)}.lane.OPTIONALITY h4{color:var(--purple)}.lane.WATCH h4{color:var(--dim)}
.lane.ACTIVE{border-color:var(--blue-b)}.lane.PASSIVE{border-color:var(--amber-b)}
.lane.SETUP{border-color:var(--green-b)}.lane.OPTIONALITY{border-color:var(--purple-b)}
.pcard{padding:8px;border-radius:6px;background:var(--surf2);border:1px solid var(--line);margin-bottom:6px}
.pcard:last-child{margin-bottom:0}
.pcard .n{font-size:12px;font-weight:600;line-height:1.3;margin-bottom:4px}
.pcard .ind{font-size:10px;color:var(--dim);line-height:1.35}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:99px}
.lane.PASSIVE .bar i{background:var(--amber)}
.lane.SETUP .bar i{background:var(--green)}
.lane.OPTIONALITY .bar i{background:var(--purple)}
.lane.WATCH .bar i{background:var(--mute)}
.lane.ACTIVE .bar i{background:var(--blue)}
.lane .empty{font-size:11px;color:var(--mute);padding:8px 2px;line-height:1.4}

/* DO NOT TOUCH */
.dnt{margin-top:12px;background:var(--red-d);border:1px solid var(--red-b);border-radius:12px;padding:14px 16px}
.dnt h3{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--red);margin-bottom:10px}
.dnt-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.dnt-c{background:rgba(0,0,0,.28);border:1px dashed var(--red-b);border-radius:8px;padding:10px}
.dnt-c .p{font-weight:600;font-size:12px;color:var(--red);margin-bottom:4px}
.dnt-c .r{font-size:11px;color:var(--dim);line-height:1.4}
.dnt-c .v{font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:6px;letter-spacing:.5px}

/* EDGE: openings threats */
.edge{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:800px){.edge{grid-template-columns:1fr}}
.ecol{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:150px}
.ecol h3{font-family:var(--mono);font-size:10px;letter-spacing:2px;margin-bottom:10px}
.ecol.open{border-color:var(--green-b);background:linear-gradient(180deg,var(--green-d),var(--surf) 55%)}
.ecol.threat{border-color:var(--red-b);background:linear-gradient(180deg,var(--red-d),var(--surf) 55%)}
.ecol.watch{border-color:var(--amber-b);background:linear-gradient(180deg,var(--amber-d),var(--surf) 55%)}
.ecol.open h3{color:var(--green)}.ecol.threat h3{color:var(--red)}.ecol.watch h3{color:var(--amber)}
.ei{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.ei:last-child{border-bottom:none}
.ei .t{font-weight:600;margin-bottom:3px;line-height:1.35}
.ei .d{font-size:11px;color:var(--dim);line-height:1.4}
.winbar{height:4px;background:var(--line);border-radius:99px;margin:6px 0 2px;position:relative;overflow:hidden}
.winbar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:99px;opacity:.7}
.badge{display:inline-block;font-family:var(--mono);font-size:8px;letter-spacing:1px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);color:var(--dim);margin-left:4px}
.badge.now{border-color:var(--red-b);color:var(--red)}
.badge.obs{border-color:var(--amber-b);color:var(--amber)}

/* HIDDEN LEVERAGE */
.hl-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.hl{background:var(--surf);border:1px solid var(--purple-b);border-radius:10px;padding:14px;position:relative}
.hl .tag{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--purple);border:1px solid var(--purple-b);padding:2px 6px;border-radius:99px}
.hl .depth{font-family:var(--mono);font-size:10px;color:var(--purple);margin-bottom:6px}
.hl .ttl{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:8px;padding-right:88px}
.hl .pair{display:grid;grid-template-columns:1fr;gap:6px;font-size:11px;line-height:1.45}
.hl .ob{padding:8px;border-radius:6px;background:rgba(255,143,64,.08);border-left:2px solid var(--red)}
.hl .hi{padding:8px;border-radius:6px;background:var(--purple-d);border-left:2px solid var(--purple)}
.hl .ob b,.hl .hi b{display:block;font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--dim);margin-bottom:3px}
.hl .models{font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:8px}

/* FLYWHEEL / STATE-SPACE */
.fw{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:4px}
.fw .eq{font-family:var(--mono);font-size:11px;color:var(--blue);line-height:1.6;padding:10px 12px;background:var(--blue-d);border:1px solid var(--blue-b);border-radius:8px;margin-bottom:12px}
.fw .eq .j{color:var(--dim);font-size:10px}
.fw-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px}
@media(max-width:900px){.fw-grid{grid-template-columns:1fr}}
.fw-card{background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fw-card h4{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--dim);margin-bottom:8px}
.fw-row{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:3px 0;border-bottom:1px solid var(--line)}
.fw-row:last-child{border-bottom:none}
.fw-row .n{color:var(--tx)}
.fw-row .v{font-family:var(--mono);font-size:10px;color:var(--dim)}
.fw-row .v.pos{color:var(--green)}.fw-row .v.neg{color:var(--red)}
.fw-note{font-size:12px;line-height:1.5;color:var(--dim);margin-top:10px}
.fw-note b{color:var(--tx);font-weight:600}
.fw-rank{font-size:11px;padding:4px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.fw-rank:last-child{border-bottom:none}
.fw-rank .id{font-family:var(--mono);font-size:9px;color:var(--mute);min-width:70px}
.fw-rank.win .n{color:var(--blue);font-weight:600}
.fw-badge{display:inline-block;font-family:var(--mono);font-size:8px;letter-spacing:1px;padding:1px 5px;border-radius:3px;margin-left:4px}
.fw-badge.hard{border:1px solid var(--red-b);color:var(--red)}
.fw-badge.soft{border:1px solid var(--purple-b);color:var(--purple)}
.loop{font-size:11px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.loop:last-child{border-bottom:none}
.loop .pol{font-family:var(--mono);font-size:9px;color:var(--green)}
.loop .pol.bad{color:var(--red)}

/* DISCLOSURE BLOCKS */
details.blk{margin-top:14px;background:var(--surf);border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.blk>summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim);padding:12px 14px;user-select:none}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary:hover{color:var(--blue)}
details.blk[open]>summary{color:var(--blue);border-bottom:1px solid var(--line)}
details.blk .body{padding:14px}

/* CAMPAIGNS */
.camp-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.camp{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surf2)}
.camp .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.camp .name{font-weight:600;font-size:13px}
.st{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.st-advancing{color:var(--green);border-color:var(--green-b)}
.st-stalled{color:var(--amber);border-color:var(--amber-b)}
.st-dormant{color:var(--mute);border-color:var(--line)}
.flow-c{display:flex;flex-direction:column;gap:0;margin:10px 0;font-size:11px}
.flow-c .fn{padding:5px 8px;border-left:2px solid var(--line);color:var(--dim)}
.flow-c .fn b{color:var(--tx);font-weight:500}
.flow-c .fn.now{border-left-color:var(--blue);color:var(--blue)}
.flow-c .fn.win{border-left-color:var(--green)}
.flow-c .fn.bot{border-left-color:var(--red)}
.tree{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:8px 0}
.tn{font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--dim)}
.tn.now,.tn.running,.tn.done{color:var(--blue);border-color:var(--blue-b);background:var(--blue-d)}
.tn.next,.tn.building,.tn.overdue{color:var(--amber);border-color:var(--amber-b)}
.tn.gated,.tn.option,.tn.armed{color:var(--purple);border-color:var(--purple-b)}
.tn.missing,.tn.blocked,.tn.future{opacity:.4}
.te{color:var(--mute);font-size:11px}
.camp .note{font-size:11px;color:var(--dim);line-height:1.4;border-top:1px solid var(--line);padding-top:8px}

/* COUNCIL */
.csum{font-size:13px;line-height:1.55;padding:12px;background:rgba(0,0,0,.25);border-radius:8px;border-left:3px solid var(--blue);margin-bottom:12px}
.cv-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.cv{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surf2)}
.cv .role{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);margin-bottom:4px}
.cv .fav{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:4px;line-height:1.35}
.cv.rt .fav{color:var(--red)}.cv.adj .fav{color:var(--green)}
.cv .why{font-size:11px;color:var(--dim);line-height:1.4}
.adj{border:1px solid var(--green-b);background:var(--green-d);border-radius:8px;padding:12px;margin-top:8px}
.adj h4{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--green);margin-bottom:8px}
.adj .row{font-size:12px;line-height:1.5;margin-bottom:4px}
.adj .row b{color:var(--dim);font-weight:500;font-family:var(--mono);font-size:10px;margin-right:6px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
@media(max-width:700px){.three{grid-template-columns:1fr}}
.three div{padding:10px;border-radius:6px;background:var(--surf2);border:1px solid var(--line);font-size:11px;line-height:1.45}
.three b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);margin-bottom:4px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.srcs span{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.srcs span.on{border-color:var(--green-b);color:var(--green)}

/* PREDICTIONS */
.bot2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){.bot2{grid-template-columns:1fr}}
.panel{background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:12px}
.panel h4{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--dim);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);padding:5px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
tr:last-child td{border-bottom:none}
.pill{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:99px;border:1px solid}
.pill-pending{color:var(--amber);border-color:var(--amber-b)}
.pill-supported{color:var(--green);border-color:var(--green-b)}
.pill-failed{color:var(--red);border-color:var(--red-b)}
.pill-unverifiable{color:var(--dim);border-color:var(--line)}
.upd{font-size:12px;color:var(--dim);line-height:1.55;margin-top:8px}
.prov{font-family:var(--mono);font-size:10px;color:var(--mute);line-height:1.7;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

/* DRAWERS / FOCUS OVERLAYS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;justify-content:flex-end}
.overlay.on{display:flex}
.drawer{width:min(440px,100%);background:var(--surf);border-left:1px solid var(--line);padding:20px;overflow-y:auto;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.drawer h3{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--blue);margin-bottom:14px}
.drawer .close{float:right;font-size:18px;color:var(--dim);line-height:1}
.drawer .close:hover{color:var(--tx)}
.drawer ul{margin:0 0 14px 16px;font-size:13px;line-height:1.6}
.drawer h4{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--dim);margin:14px 0 6px}
.drawer p{font-size:13px;line-height:1.5;margin-bottom:8px}

.focus{display:none;position:fixed;inset:0;background:var(--bg);z-index:110;padding:40px 20px;overflow-y:auto}
.focus.on{display:block}
.focus-inner{max-width:560px;margin:40px auto}
.focus h2{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--blue);margin-bottom:24px}
.focus .obj{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:24px}
.focus .box{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.focus .box .k{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:6px}
.focus .box .v{font-size:15px;line-height:1.5}
.focus .steps{list-style:none;margin:0}
.focus .steps li{padding:10px 12px;border-left:2px solid var(--line);margin-bottom:4px;font-size:14px;color:var(--dim)}
.focus .steps li.cur{border-left-color:var(--blue);color:var(--tx);background:var(--blue-d)}
.focus .meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin:16px 0}
.focus .row{display:flex;gap:10px;margin-top:20px}
.focus .exit{margin-top:24px;font-size:12px;color:var(--dim)}

.hidden{display:none}
#error{display:none;color:var(--red);font-family:var(--mono);padding:20px}
.view{display:none}.view.on{display:block}

@media(max-width:700px){
  .top{flex-wrap:wrap;gap:8px}
  .shell{padding:12px}
  .primary h2{font-size:17px}
}
</style>

<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function pill(r){return '<span class="pill pill-'+esc(r)+'">'+esc(r)+'</span>'}
function pct(x){return Math.round((Number(x)||0)*100)}
function dirArrow(d){return d==='up'?'↑':d==='down'?'↓':'→'}
function clip(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n-1)+'…':s}
function polar(cx,cy,rx,ry,i,n){
  var a=(-Math.PI/2)+(i*(2*Math.PI/Math.max(n,1)));
  return {x:cx+rx*Math.cos(a), y:cy+ry*Math.sin(a)};
}

function renderMindmap(p){
  var domains=p.domains||[];
  var n=domains.length||1;
  var h='<div class="mmap">';
  h+='<svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none">';
  domains.forEach(function(dom,i){
    var pt=polar(50,50,41,39,i,n);
    var col=dom.direction==='up'?'#b8d94c':dom.direction==='down'?'#ff8f40':'#ffb454';
    h+='<line x1="50" y1="50" x2="'+pt.x.toFixed(1)+'" y2="'+pt.y.toFixed(1)+'" stroke="'+col+'" stroke-width="0.35" opacity="0.55"/>';
  });
  h+='</svg>';
  h+='<div class="mmap-hub"><div class="k">YOU · NOW</div><div class="v">'+esc(clip(p.headline||'Current position',90))+'</div></div>';
  domains.forEach(function(dom,i){
    var pt=polar(50,50,41,39,i,n);
    var dir=dom.direction||'stable';
    var left=pt.x;
    var top=pt.y;
    h+='<div class="mmap-node '+esc(dir)+'" style="left:calc('+left.toFixed(2)+'% - 84px);top:calc('+top.toFixed(2)+'% - 52px)">';
    h+='<div class="lab">'+esc(dom.label)+'</div>';
    h+='<div class="dir">'+dirArrow(dir)+' '+esc(dom.status||'')+'</div>';
    h+='<div class="meta"><b>C</b> '+esc(clip(dom.constraint||'—',42))+'<br><b>O</b> '+esc(clip(dom.opening||'—',42))+'</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function renderAfterFlow(pa,pm){
  var branches=pa.branches||[];
  var move=clip(pm.title||'Primary move',42);
  var next=clip(pa.next_label||'AFTER MOVE',28);
  var h='<div class="flowbox"><h3>POSITION AFTER MOVE</h3>';
  h+='<svg class="flow-svg" viewBox="0 0 520 248" preserveAspectRatio="xMidYMin meet">';
  h+='<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#39bae6"/></marker>';
  h+='<marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9a0ff"/></marker></defs>';
  h+='<rect class="box cur" x="18" y="28" rx="8" width="130" height="52"/>';
  h+='<text class="lbl" x="83" y="46" text-anchor="middle">CURRENT</text>';
  h+='<text class="sub" x="83" y="64" text-anchor="middle">board now</text>';
  h+='<path class="arr" d="M148 54 H 210"/>';
  h+='<rect class="box next" x="210" y="22" rx="8" width="170" height="64"/>';
  h+='<text class="lbl" x="295" y="40" text-anchor="middle">MOVE</text>';
  h+='<text class="ttl" x="295" y="58" text-anchor="middle">'+esc(clip(move,26))+'</text>';
  h+='<text class="sub" x="295" y="74" text-anchor="middle">'+esc(clip(pm.type||'active',18).toUpperCase())+'</text>';
  h+='<path class="arr" d="M380 54 H 400"/>';
  h+='<rect class="box next" x="400" y="22" rx="8" width="108" height="64"/>';
  h+='<text class="lbl" x="454" y="42" text-anchor="middle">NEXT</text>';
  h+='<text class="ttl" x="454" y="60" text-anchor="middle">'+esc(clip(next,14))+'</text>';
  h+='<path class="arr2" d="M295 86 V 118"/>';
  var bw=Math.min(branches.length||1,3);
  branches.slice(0,3).forEach(function(b,i){
    var x=40+i*160;
    h+='<path class="arr2" d="M295 118 H '+(x+70)+' V 138"/>';
    h+='<rect class="box fork" x="'+x+'" y="138" rx="8" width="140" height="58"/>';
    h+='<text class="lbl" x="'+(x+70)+'" y="156" text-anchor="middle">PATH '+esc(b.id||String.fromCharCode(65+i))+'</text>';
    h+='<text class="ttl" x="'+(x+70)+'" y="172" text-anchor="middle">'+esc(clip(b.label,18))+'</text>';
    h+='<text class="sub" x="'+(x+70)+'" y="186" text-anchor="middle">'+esc(clip(b.effect,20))+'</text>';
  });
  if(!branches.length){
    h+='<text class="sub" x="295" y="150" text-anchor="middle">No branch yet</text>';
  }
  h+='<text class="sub" x="260" y="236" text-anchor="middle">'+esc(clip(pa.headline||'',72))+'</text>';
  h+='</svg>';
  return h;
}

function renderCampaignTree(c){
  var nodes=(c.tree&&c.tree.nodes)||[];
  var edges=(c.tree&&c.tree.edges)||[];
  var byId={};
  nodes.forEach(function(n){byId[n.id]=n});
  var indeg={};
  edges.forEach(function(e){indeg[e.to]=(indeg[e.to]||0)+1});
  var layers=[];
  var placed={};
  var roots=nodes.filter(function(n){return !indeg[n.id]});
  if(!roots.length && nodes.length) roots=[nodes[0]];
  var q=roots.slice();
  q.forEach(function(n){placed[n.id]=0});
  layers[0]=roots.slice();
  var guard=0;
  while(q.length && guard<40){
    guard++;
    var cur=q.shift();
    var L=placed[cur.id];
    edges.forEach(function(e){
      if(e.from!==cur.id || placed[e.to]!=null) return;
      placed[e.to]=L+1;
      if(!layers[L+1]) layers[L+1]=[];
      if(byId[e.to]){layers[L+1].push(byId[e.to]);q.push(byId[e.to])}
    });
  }
  nodes.forEach(function(n){
    if(placed[n.id]==null){
      if(!layers[0]) layers[0]=[];
      layers[0].push(n);
    }
  });
  var W=980, H=200, pad=40;
  var pos={};
  layers.forEach(function(ly,li){
    var y=28+li*((H-20)/Math.max(layers.length,1));
    ly.forEach(function(n,ni){
      var x=pad+((W-pad*2)/(Math.max(ly.length,1)+1))*(ni+1);
      pos[n.id]={x:x,y:y};
    });
  });
  var fill={now:'#39bae6',running:'#39bae6',done:'#b8d94c',next:'#ffb454',building:'#ffb454',overdue:'#ff8f40',gated:'#c9a0ff',option:'#c9a0ff',armed:'#c9a0ff',missing:'#3d4f60',blocked:'#ff8f40',future:'#3d4f60'};
  var h='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  edges.forEach(function(e){
    var a=pos[e.from], b=pos[e.to];
    if(!a||!b) return;
    h+='<line x1="'+a.x+'" y1="'+(a.y+14)+'" x2="'+b.x+'" y2="'+(b.y-14)+'" stroke="#1a2533" stroke-width="1.4"/>';
  });
  nodes.forEach(function(n){
    var p=pos[n.id]; if(!p) return;
    var col=fill[n.status]||'#6a8094';
    h+='<rect x="'+(p.x-78)+'" y="'+(p.y-16)+'" width="156" height="32" rx="8" fill="#121a24" stroke="'+col+'"/>';
    h+='<text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" font-family="Space Mono,monospace" font-size="11" fill="#c8d5e0">'+esc(clip(n.label,22))+'</text>';
  });
  h+='</svg>';
  return h;
}
var DATA=null;

function setMode(m){
  document.querySelectorAll('.mode').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m)});
  document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id==='view-'+m)});
  if(m==='FOCUS' && DATA) openFocus(false);
}

function openFocus(fullscreen){
  if(!DATA) return;
  var ft=DATA.focus_tunnel||{}, pm=DATA.primary_move||{};
  var h='';
  h+='<h2>FOCUS TUNNEL</h2>';
  h+='<div class="obj">'+esc(ft.objective||pm.title)+'</div>';
  h+='<div class="box"><div class="k">CURRENT STEP</div><div class="v">'+esc(ft.current_step||'')+'</div></div>';
  if(ft.steps&&ft.steps.length){
    h+='<div class="box"><div class="k">SEQUENCE</div><ul class="steps">';
    ft.steps.forEach(function(s,i){h+='<li class="'+(i===0?'cur':'')+'">'+(i+1)+'. '+esc(s)+'</li>'});
    h+='</ul></div>';
  }
  h+='<div class="box"><div class="k">DONE WHEN</div><div class="v">'+esc(ft.done_when||pm.done_when||'')+'</div></div>';
  h+='<div class="meta">'+esc(ft.time_energy||'')+'</div>';
  if(ft.next_after) h+='<div class="box"><div class="k">NEXT</div><div class="v">'+esc(ft.next_after)+'</div></div>';
  h+='<div class="row"><button class="btn go" id="focus-ack">START · 90 MIN BLOCK</button>';
  h+='<button class="btn" id="focus-exit2">EXIT FOCUS</button></div>';
  h+='<div class="exit">Strategic engine decides. Focus tunnel executes. Unrelated board state is hidden.</div>';
  if(fullscreen){
    document.getElementById('focus-body').innerHTML=h;
    document.getElementById('focus-tunnel').classList.add('on');
    document.getElementById('focus-exit2').onclick=function(){document.getElementById('focus-tunnel').classList.remove('on');setMode('BOARD')};
    document.getElementById('focus-ack').onclick=function(){document.getElementById('focus-ack').textContent='BLOCK ARMED · GO';};
  } else {
    document.getElementById('view-FOCUS').innerHTML='<div class="focus-inner" style="margin:0">'+h+'</div>';
    var ex=document.querySelector('#view-FOCUS #focus-exit2');
    if(ex) ex.onclick=function(){setMode('BOARD')};
    var ac=document.querySelector('#view-FOCUS #focus-ack');
    if(ac) ac.onclick=function(){ac.textContent='BLOCK ARMED · GO'};
  }
}

function renderBoard(d){
  var p=d.position||{}, sm=d.strategic_momentum||{}, pm=d.primary_move||{}, pa=d.position_after||{};
  var h='';

  // Strategic momentum
  h+='<div class="mom-panel">';
  h+='<div class="mom-big"><div class="k">STRATEGIC MOMENTUM</div>';
  h+='<div class="v">'+(sm.direction==='up'?'↑ ':sm.direction==='down'?'↓ ':'→ ')+esc(sm.label||'')+'</div>';
  h+='<div class="s">'+esc(sm.summary||'')+'</div></div>';
  h+='<div class="mom-sigs">';
  (sm.signals||[]).forEach(function(s){
    h+='<div class="sig"><div class="t">'+esc((s.kind||'').toUpperCase())+'</div>'+esc(s.text)+'</div>';
  });
  h+='</div></div>';

  // Current position mindmap
  h+='<div class="sec">Current position</div>';
  h+=renderMindmap(p);
  h+='<div class="pos-sum"><strong>Position.</strong> '+esc(p.summary||p.headline||'')+(p.timing?' <span style="font-family:var(--mono);font-size:11px;color:var(--amber)"> · '+esc(p.timing)+'</span>':'')+'</div>';

  // HERO: Best move + Position after
  h+='<div class="sec">Best move now · position after</div>';
  h+='<div class="hero">';

  // Primary
  h+='<div class="primary">';
  h+='<div class="tag">BEST MOVE NOW · '+esc((pm.type||'active').toUpperCase())+' · ATTENTION</div>';
  h+='<h2>'+esc(pm.title)+'</h2>';
  h+='<div class="obj">Objective: '+esc(pm.objective||'')+'</div>';
  h+='<div class="pg">';
  h+='<div class="pf"><div class="k">WHY NOW</div><div class="v">'+esc(pm.why_now)+'</div></div>';
  h+='<div class="pf"><div class="k">LEVERAGE</div><div class="v"><span class="lev">'+esc(pm.leverage||'')+'</span></div></div>';
  h+='<div class="pf"><div class="k">EFFORT</div><div class="v">'+esc(pm.effort||'')+'</div></div>';
  h+='<div class="pf"><div class="k">RISK</div><div class="v">'+esc(pm.risk||'')+'</div></div>';
  h+='<div class="pf"><div class="k">REVERSIBILITY</div><div class="v">'+esc(pm.reversibility||'')+'</div></div>';
  h+='<div class="pf"><div class="k">CONFIDENCE</div><div class="v">'+esc((pm.confidence&&pm.confidence.label)||'')+'<div style="font-size:11px;color:var(--dim);margin-top:3px">'+esc((pm.confidence&&pm.confidence.detail)||'')+'</div></div></div>';
  h+='</div>';
  h+='<div class="pf" style="margin-bottom:12px"><div class="k">EXPECTED EFFECT</div><div class="v">'+esc(pm.expected_effect||'')+'</div></div>';
  h+='<div class="actions">';
  h+='<button class="btn go" data-act="EXECUTE">EXECUTE</button>';
  h+='<button class="btn" data-act="WHY">WHY THIS?</button>';
  h+='<button class="btn" data-act="ALT">ALTERNATIVES</button>';
  h+='<button class="btn" data-act="SIM">SIMULATE</button>';
  h+='<button class="btn warn" data-act="NOTNOW">NOT NOW</button>';
  h+='</div>';
  h+='<div class="execute-box"><div class="k">▶ EXECUTE</div><div class="v">'+esc(pm.execute||'')+'</div>';
  h+='<div class="done">done when: '+esc(pm.done_when||'')+'</div></div>';
  if(pm.stop_condition) h+='<div class="stop">STOP: '+esc(pm.stop_condition)+'</div>';
  h+='</div>';

  // After flowchart
  h+=renderAfterFlow(pa,pm);
  h+='<div style="font-size:12px;line-height:1.45;margin:4px 0 10px;color:var(--dim)">'+esc(pa.headline||'')+'</div>';
  h+='<div class="effects">';
  h+='<div class="eff open"><b>OPTIONS OPENED</b>'+(pa.opens||[]).map(esc).join('<br>')+'</div>';
  h+='<div class="eff close"><b>OPTIONS CLOSED</b>'+(pa.closes||[]).map(esc).join('<br>')+'</div>';
  h+='<div class="eff info"><b>INFORMATION GAINED</b>'+(pa.information_gained||[]).map(esc).join('<br>')+'</div>';
  h+='<div class="eff risk"><b>RISKS REMOVED</b>'+(pa.risks_removed||[]).map(esc).join('<br>')+'</div>';
  h+='</div></div>';

  h+='</div>'; // hero

  // Parallel pipeline
  h+='<div class="sec">Parallel momentum</div>';
  h+='<div class="pipe">';
  var lanes=d.parallel_lanes||{};
  var LANE=['ACTIVE','PASSIVE','SETUP','OPTIONALITY','WATCH'];
  LANE.forEach(function(L,i){
    var items=lanes[L]||[];
    h+='<div class="pipe-col lane '+L+'"><h4>'+L+(L==='PASSIVE'?' / MATURING':'')+'</h4>';
    if(i<LANE.length-1) h+='<div class="pipe-arrow">→</div>';
    if(!items.length){
      h+='<div class="empty">'+(L==='ACTIVE'?'Primary move holds the only active attention slot.':'None')+'</div>';
    } else {
      items.forEach(function(it){
        h+='<div class="pcard"><div class="n">'+esc(it.name)+'</div>';
        h+='<div class="bar"><i style="width:'+pct(it.progress)+'%"></i></div>';
        h+='<div class="ind">'+esc(it.indicator||it.progress_basis||it.state||'')+'</div></div>';
      });
    }
    h+='</div>';
  });
  h+='</div>';

  // Do not touch
  h+='<div class="dnt"><h3>⊘ DO NOT TOUCH — protect what is compounding</h3><div class="dnt-g">';
  (d.do_not_touch||[]).forEach(function(x){
    h+='<div class="dnt-c"><div class="p">'+esc(x.process||x.item)+'</div>';
    h+='<div class="r">'+esc(x.reason)+'</div>';
    h+='<div class="v">REVISIT · '+esc(x.revisit||x.until||'—')+'</div></div>';
  });
  h+='</div></div>';

  // Edge
  h+='<div class="sec">What opens next · edge of the board</div>';
  h+='<div class="edge">';
  h+='<div class="ecol open"><h3>◇ OPENINGS</h3>';
  if(!(d.openings||[]).length) h+='<div class="ei"><div class="d">'+esc((d.empty_states||{}).openings||'None')+'</div></div>';
  (d.openings||[]).forEach(function(o){
    h+='<div class="ei"><div class="t">'+esc(o.title||o.what)+'</div>';
    h+='<div class="d">'+esc(o.why_exists||o.mechanism||'')+'</div>';
    h+='<div class="winbar"><i style="width:'+pct(o.urgency||0.4)+'%"></i></div>';
    h+='<div class="d">window '+esc(o.window_start||'')+(o.window_end?' → '+esc(o.window_end):'')+' · '+esc(o.status||'')+'</div></div>';
  });
  h+='</div>';
  h+='<div class="ecol threat"><h3>▲ THREATS</h3>';
  (d.threats||[]).forEach(function(t){
    h+='<div class="ei"><div class="t">'+esc(t.title||t.what);
    if(t.requires_action_now) h+='<span class="badge now">NOW</span>';
    if(t.kind) h+='<span class="badge obs">'+esc(t.kind)+'</span>';
    h+='</div><div class="d">'+esc(t.impact)+' · warn: '+esc(t.early_warning_signal||t.early_warning||'')+'</div>';
    h+='<div class="d">mitigation: '+esc(t.mitigation||'')+'</div></div>';
  });
  h+='</div>';
  h+='<div class="ecol watch"><h3>◎ WATCH FOR</h3>';
  (d.watch_for||[]).forEach(function(w){
    h+='<div class="ei"><div class="t">IF '+esc(w.condition)+'</div>';
    h+='<div class="d">THEN '+esc(w.action||w.then||'')+'</div>';
    h+='<div class="d">WHY '+esc(w.reason||'')+'</div></div>';
  });
  h+='</div></div>';

  // Hidden leverage
  if((d.hidden_leverage||[]).length){
    h+='<div class="sec">Hidden leverage · non-obvious</div><div class="hl-g">';
    d.hidden_leverage.forEach(function(hl){
      h+='<div class="hl"><div class="tag">NON-OBVIOUS</div>';
      h+='<div class="depth">DEPTH '+esc(hl.depth)+'</div>';
      h+='<div class="ttl">'+esc(hl.title)+'</div>';
      h+='<div class="pair">';
      h+='<div class="ob"><b>OBVIOUS</b>'+esc(hl.baseline_missed)+'</div>';
      h+='<div class="hi"><b>HIDDEN LEVERAGE</b>'+esc(hl.reframe)+'</div>';
      h+='</div>';
      h+='<div class="models">'+(hl.models||[]).map(esc).join(' · ')+'</div></div>';
    });
    h+='</div>';
  }

  // Life flywheel panel removed — formal models (state-space/minimax/game theory)
  // are now council-routable methods applied per-problem, not an always-on panel.

  document.getElementById('view-BOARD').innerHTML=h;
  wirePrimaryActions();
}

function renderCampaigns(d){
  var h='<div class="sec">Campaigns · destinations & move trees</div><div class="ctree-g">';
  (d.campaigns||[]).forEach(function(c){
    h+='<div class="ctree"><div class="head"><div class="name">'+esc(c.name)+'</div><span class="st st-'+esc(c.status)+'">'+esc(c.status)+'</span></div>';
    h+='<div class="flow-c">';
    h+='<div class="fn win"><b>DESTINATION</b> '+esc(c.desired_state||c.target_state||'')+'</div>';
    h+='<div class="fn"><b>CURRENT</b> '+esc(c.current_state||c.distance||'')+'</div>';
    h+='<div class="fn bot"><b>BOTTLENECK</b> '+esc(c.key_bottleneck||'—')+'</div>';
    h+='<div class="fn now"><b>HORIZON</b> '+esc(c.horizon||'')+'</div>';
    h+='</div>';
    if(c.tree){
      h+=renderCampaignTree(c);
      h+='<div class="note">'+esc(c.tree.note||c.win_condition||'')+'</div>';
    }
    h+='</div>';
  });
  h+='</div>';
  document.getElementById('view-CAMPAIGNS').innerHTML=h;
}

function renderCouncil(d){
  var c=d.council||{};
  var views=c.views||[];
  var a=c.adjudicator||{};
  var h='<div class="sec">STEM Council · disagreement & adjudication</div>';
  if(c.disagreement_summary) h+='<div class="csum">'+esc(c.disagreement_summary)+'</div>';
  h+='<div class="crad">';
  h+='<svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none">';
  views.forEach(function(cv,i){
    var pt=polar(50,50,36,34,i,Math.max(views.length,1));
    var rt=(cv.role||'').indexOf('Red')>=0;
    h+='<line x1="50" y1="50" x2="'+pt.x.toFixed(1)+'" y2="'+pt.y.toFixed(1)+'" stroke="'+(rt?'#ff8f40':'#39bae6')+'" stroke-width="0.3" opacity="0.5"/>';
  });
  h+='</svg>';
  h+='<div class="crad-hub"><div class="k">ADJUDICATOR</div><div class="v">'+esc(clip(a.recommended||'No synthesis yet',140))+'</div></div>';
  views.forEach(function(cv,i){
    var pt=polar(50,50,36,34,i,Math.max(views.length,1));
    var rt=(cv.role||'').indexOf('Red')>=0;
    h+='<div class="crad-node'+(rt?' rt':'')+'" style="left:calc('+pt.x.toFixed(2)+'% - 88px);top:calc('+pt.y.toFixed(2)+'% - 36px)">';
    h+='<div class="role">'+esc(cv.role)+'</div><div class="fav">→ '+esc(clip(cv.favors,110))+'</div></div>';
  });
  h+='</div>';
  h+='<div class="three">';
  var tc=c.three_candidates||{};
  h+='<div><b>CONVENTIONAL</b>'+esc(tc.conventional||'')+'</div>';
  h+='<div><b>STRATEGIC</b>'+esc(tc.strategic||'')+'</div>';
  h+='<div><b>ASYMMETRIC</b>'+esc(tc.asymmetric||'')+'</div>';
  h+='</div>';
  h+='<div class="adj"><h4>ADJUDICATOR</h4>';
  h+='<div class="row"><b>RECOMMENDED</b> '+esc(a.recommended||'')+'</div>';
  h+='<div class="row"><b>WHY</b> '+esc(a.why||'')+'</div>';
  h+='<div class="row"><b>KEY DISAGREEMENT</b> '+esc(a.key_disagreement||'')+'</div>';
  h+='<div class="row"><b>WHAT CHANGES DECISION</b> '+esc(a.what_changes_decision||'')+'</div>';
  h+='</div>';
  if(c.depth_gate){
    h+='<div style="margin-top:12px;font-size:11px;color:var(--dim)"><span style="font-family:var(--mono);letter-spacing:1px">DEPTH GATE · L'+esc(c.depth_gate.level_reached)+'</span> · '+(c.depth_gate.inspected||[]).map(esc).join(' · ')+'</div>';
  }
  h+='<div class="srcs">';
  (c.sources_used||[]).forEach(function(s){h+='<span class="'+(s.used?'on':'')+'">'+(s.used?'✓ ':'○ ')+esc(s.name)+'</span>'});
  h+='</div>';
  document.getElementById('view-COUNCIL').innerHTML=h;
}

function renderIntel(d){
  var h='<div class="sec">Intelligence · source arsenal</div>';
  var srcs=d.sources_active||[];
  if(!srcs.length){
    h+='<div class="panel"><h4>NO SOURCES YET</h4><p style="font-size:13px;line-height:1.5;color:var(--dim)">'+esc((d.empty_states||{}).sources||'Add a STEM source anytime.')+'</p>';
    h+='<p style="font-size:12px;color:var(--mute);margin-top:10px">Council this cycle used built-in frameworks only (see COUNCIL mode for source ticks).</p></div>';
  } else {
    srcs.forEach(function(s){h+='<div class="panel" style="margin-bottom:8px">'+esc(JSON.stringify(s))+'</div>'});
  }
  document.getElementById('view-INTELLIGENCE').innerHTML=h;
}

function renderReview(d){
  var h='<div class="sec">Predictions · debrief · calibration</div><div class="bot2">';
  h+='<div class="panel"><h4>OPEN PREDICTIONS</h4><table><thead><tr><th>ID</th><th>Claim</th><th>Check</th><th></th></tr></thead><tbody>';
  (d.predictions||[]).forEach(function(pr){
    h+='<tr><td>'+esc(pr.id)+'</td><td>'+esc(pr.statement||pr.claim)+'</td><td>'+esc(pr.check_by)+'</td><td>'+pill(pr.result||'pending')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  var vd=d.verdict||{};
  h+='<div class="panel"><h4>DEBRIEF / VERDICT</h4><table><thead><tr><th>Prior</th><th></th><th>Evidence</th></tr></thead><tbody>';
  (vd.previous_predictions||[]).forEach(function(pr){
    h+='<tr><td>'+esc(pr.statement)+'</td><td>'+pill(pr.result)+'</td><td style="color:var(--dim)">'+esc(pr.evidence)+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="upd">'+(vd.model_updates||[]).map(function(u){return '• '+esc(u)}).join('<br>')+'</div></div>';
  h+='</div>';
  document.getElementById('view-REVIEW').innerHTML=h;
}

function wirePrimaryActions(){
  document.querySelectorAll('[data-act]').forEach(function(b){
    b.onclick=function(){
      var a=b.getAttribute('data-act');
      if(a==='EXECUTE'){openFocus(true)}
      else if(a==='WHY'){openWhy()}
      else if(a==='ALT'){openAlt()}
      else if(a==='SIM'){setMode('BOARD');document.getElementById('view-BOARD').scrollIntoView({behavior:'smooth'});/* position after already visible */}
      else if(a==='NOTNOW'){alert('Override noted. Tell Hermes why (wrong assumption / missing info / impossible now / preference) and the board will update next cycle.')}
    };
  });
}
function openWhy(){
  if(!DATA) return;
  var w=DATA.why_drawer||{}, pm=DATA.primary_move||{};
  var h='<ul>';
  (w.bullets||[]).forEach(function(b){h+='<li>'+esc(b)+'</li>'});
  h+='</ul>';
  h+='<h4>ASSUMPTIONS</h4><ul>';
  (w.assumptions||[]).forEach(function(b){h+='<li>'+esc(b)+'</li>'});
  h+='</ul>';
  h+='<h4>MECHANISM</h4><p>'+esc(pm.mechanism||'')+'</p>';
  h+='<h4>EVIDENCE REFS</h4><p style="font-family:var(--mono);font-size:11px;color:var(--dim)">'+(pm.journal_evidence_ids||[]).map(esc).join(' · ')+'</p>';
  h+='<h4>PREDICTIONS</h4><p>'+(w.prediction_ids||pm.prediction_ids||[]).map(esc).join(', ')+'</p>';
  h+='<h4>STOP / REVIEW TRIGGER</h4><p>'+esc(pm.review_trigger||pm.stop_condition||'')+'</p>';
  document.getElementById('why-body').innerHTML=h;
  document.getElementById('why-overlay').classList.add('on');
}
function openAlt(){
  if(!DATA) return;
  var c=DATA.council||{}, w=DATA.why_drawer||{};
  var h='';
  var tc=c.three_candidates||{};
  h+='<h4>THREE STRATEGIC CANDIDATES</h4>';
  h+='<p><b style="color:var(--dim)">CONVENTIONAL</b><br>'+esc(tc.conventional||'')+'</p>';
  h+='<p><b style="color:var(--blue)">STRATEGIC (selected)</b><br>'+esc(tc.strategic||'')+'</p>';
  h+='<p><b style="color:var(--purple)">ASYMMETRIC</b><br>'+esc(tc.asymmetric||'')+'</p>';
  h+='<h4>DEPTH-GATE ALTERNATIVES</h4><ul>';
  (c.alternatives||w.competing_options||[]).forEach(function(a){h+='<li>'+esc(a)+'</li>'});
  h+='</ul>';
  if(c.disagreement_summary) h+='<h4>DISAGREEMENT</h4><p>'+esc(c.disagreement_summary)+'</p>';
  document.getElementById('alt-body').innerHTML=h;
  document.getElementById('alt-overlay').classList.add('on');
}

function renderAll(d){
  DATA=d;
  document.getElementById('gen').textContent=(d.generated_at||'').slice(0,10)+' · '+(d.version||'');
  var sm=d.strategic_momentum||{};
  var chip=document.getElementById('mom-chip');
  chip.textContent=(sm.direction==='up'?'↑ ':sm.direction==='down'?'↓ ':'→ ')+(sm.label||'—');
  chip.className='mom-chip'+(sm.direction==='down'?' down':sm.direction==='up'?'':' flat');
  var sync=d.last_sync||d.generated_at||'';
  document.getElementById('sync').textContent='Last sync: '+(sync.replace('T',' ').replace('Z','')||'—');

  // delta
  if(d.delta&&d.delta.items&&d.delta.items.length){
    var el=document.getElementById('delta');
    el.classList.remove('hidden');
    var dh='<span class="lab">WHAT CHANGED</span>';
    d.delta.items.forEach(function(i){
      var cls=i.kind==='plus'?'plus':i.kind==='warn'?'warn':'same';
      dh+='<span class="i '+cls+'">'+esc(i.text)+'</span>';
    });
    el.innerHTML=dh;
  }

  renderBoard(d);
  renderCampaigns(d);
  renderCouncil(d);
  renderIntel(d);
  renderReview(d);

  var pv=d.provenance||{};
  document.getElementById('prov').innerHTML='fingerprint '+esc((d.fingerprint||'').slice(0,16))+'… · nodes '+esc(pv.nodes)+' · tasks '+esc(pv.tasks)+' · notes '+esc(pv.notes)+' · bodies '+esc(pv.bodies_read)+
    ((pv.quality_flags&&pv.quality_flags.length)?'<br>flags: '+pv.quality_flags.map(esc).join(' · '):'');
}

document.getElementById('modes').onclick=function(e){
  var b=e.target.closest('.mode'); if(!b) return; setMode(b.dataset.mode);
};
document.getElementById('why-close').onclick=function(){document.getElementById('why-overlay').classList.remove('on')};
document.getElementById('alt-close').onclick=function(){document.getElementById('alt-overlay').classList.remove('on')};
document.getElementById('why-overlay').onclick=function(e){if(e.target===this)this.classList.remove('on')};
document.getElementById('alt-overlay').onclick=function(e){if(e.target===this)this.classList.remove('on')};

function fail(m){var e=document.getElementById('error');e.style.display='block';e.textContent='Board unavailable: '+m}
fetch('/api/growth-engine').then(function(r){if(!r.ok)throw new Error('api '+r.status);return r.json()}).then(renderAll)
