<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Board — Personal Strategy OS</title>
<style>
:root {
  --bg:#070b10; --surface:#0f1520; --surface2:#151c28; --border:#1e2a3a;
  --text:#c5d4e0; --text-dim:#6b8499; --accent:#39bae6; --accent-dim:rgba(57,186,230,.12);
  --green:#c2d94c; --green-dim:rgba(194,217,76,.12);
  --red:#ff8f40; --red-dim:rgba(255,143,64,.12);
  --yellow:#ffb454; --yellow-dim:rgba(255,180,84,.12);
  --purple:#d2a6ff; --purple-dim:rgba(210,166,255,.12);
  --mono:'Space Mono','SF Mono',Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:28px 18px 80px;max-width:1220px;margin:0 auto}
a{color:inherit}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:22px}
.hdr h1{font-family:var(--mono);font-size:18px;color:var(--accent);letter-spacing:3px}
.hdr .sub{color:var(--text-dim);font-size:11px;margin-top:3px;font-family:var(--mono)}
.back{color:var(--text-dim);text-decoration:none;font-size:12px;border:1px solid var(--border);padding:5px 10px;border-radius:4px}
.back:hover{color:var(--accent);border-color:var(--accent)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--text-dim)}
.flow span{padding:4px 10px;border:1px solid var(--border);border-radius:999px}
.flow span.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.flow .arr{border:none;padding:4px 0;color:var(--border)}

/* SECTION LABELS */
.sec{font-family:var(--mono);font-size:10px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.sec:before{content:'';flex:0 0 18px;height:1px;background:var(--border)}
.sec:after{content:'';flex:1;height:1px;background:var(--border)}

/* TERRITORY MAP */
.territory{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
@media(max-width:900px){.territory{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.territory{grid-template-columns:repeat(2,1fr)}}
.cell{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 12px 10px;position:relative;overflow:hidden;min-height:110px}
.cell .fill{position:absolute;left:0;bottom:0;right:0;opacity:.18;transition:height .4s}
.cell.held .fill{background:var(--green)}
.cell.contested .fill{background:var(--yellow)}
.cell.weak .fill{background:var(--red)}
.cell.unowned .fill{background:var(--text-dim)}
.cell .lab{font-family:var(--mono);font-size:11px;letter-spacing:1px;position:relative;z-index:1}
.cell .pct{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:6px;position:relative;z-index:1}
.cell .note{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.35;position:relative;z-index:1}
.cell.held .lab,.cell.held .pct{color:var(--green)}
.cell.contested .lab,.cell.contested .pct{color:var(--yellow)}
.cell.weak .lab,.cell.weak .pct{color:var(--red)}
.cell.unowned .lab,.cell.unowned .pct{color:var(--text-dim)}
.pos-meta{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:8px}
@media(max-width:800px){.pos-meta{grid-template-columns:1fr}}
.meta-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.meta-card h3{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:8px}
.meta-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.meta-row:last-child{border-bottom:none}
.meta-row .l{color:var(--text)}
.meta-row .r{color:var(--text-dim);font-family:var(--mono);font-size:10px}
.lvl-scarce,.lvl-unknown{color:var(--red)}
.lvl-strong,.lvl-active{color:var(--green)}
.headline{font-size:15px;line-height:1.5;color:var(--text);margin:10px 0 4px}
.momentum{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
.mom-rising{color:var(--green)}.mom-falling{color:var(--red)}.mom-flat{color:var(--yellow)}
.vec{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.vec .v{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.vec .v b{color:var(--text);font-size:13px;margin-right:4px}

/* PRIMARY MOVE — dominates */
.primary{background:linear-gradient(165deg,rgba(57,186,230,.14),var(--surface) 45%);border:1px solid var(--accent);border-radius:14px;padding:22px 24px;margin-bottom:8px;box-shadow:0 0 0 1px rgba(57,186,230,.08),0 12px 40px rgba(0,0,0,.35)}
.primary .tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--accent);margin-bottom:8px}
.primary h2{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:14px;color:#e8f4fa}
.primary .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:16px}
@media(max-width:700px){.primary .grid{grid-template-columns:1fr}}
.primary .field .k{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:3px}
.primary .field .v{font-size:13px;line-height:1.5}
.execute{background:var(--accent-dim);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;margin-top:4px}
.execute .k{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--accent);margin-bottom:6px}
.execute .v{font-size:14px;line-height:1.55;color:#e8f4fa}
.execute .done{font-size:12px;color:var(--text-dim);margin-top:8px}
.stop{font-size:12px;color:var(--red);margin-top:10px;font-family:var(--mono)}

/* PARALLEL PROCESSES — moving */
.par-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.proc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden}
.proc.PASSIVE{border-color:rgba(194,217,76,.35)}
.proc.SETUP{border-color:rgba(255,180,84,.35)}
.proc.OPTIONALITY{border-color:rgba(210,166,255,.35)}
.proc.WATCH{border-color:var(--border)}
.proc .cls{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;margin-bottom:6px}
.proc.PASSIVE .cls{color:var(--green)}
.proc.SETUP .cls{color:var(--yellow)}
.proc.OPTIONALITY .cls{color:var(--purple)}
.proc.WATCH .cls{color:var(--text-dim)}
.proc .ttl{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:8px}
.bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar > i{display:block;height:100%;border-radius:99px}
.proc.PASSIVE .bar > i{background:var(--green);box-shadow:0 0 12px rgba(194,217,76,.5);animation:pulse 2.4s ease-in-out infinite}
.proc.SETUP .bar > i{background:var(--yellow)}
.proc.OPTIONALITY .bar > i{background:var(--purple)}
.proc.WATCH .bar > i{background:var(--text-dim)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.proc .ind{font-size:11px;color:var(--text-dim);line-height:1.4}
.proc .trig{font-family:var(--mono);font-size:10px;color:var(--text-dim);margin-top:6px}

/* DO NOT TOUCH — prominent */
.dnt-wrap{background:var(--red-dim);border:1px solid rgba(255,143,64,.45);border-radius:12px;padding:16px 18px}
.dnt-wrap h3{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--red);margin-bottom:10px}
.dnt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dnt{background:rgba(0,0,0,.25);border:1px dashed rgba(255,143,64,.4);border-radius:8px;padding:10px 12px}
.dnt .i{font-weight:600;font-size:13px;color:var(--red);margin-bottom:4px}
.dnt .r{font-size:11px;color:var(--text-dim);line-height:1.4}

/* EDGE OF BOARD — openings / threats / watch */
.edge{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:800px){.edge{grid-template-columns:1fr}}
.edge-col{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;min-height:160px}
.edge-col h3{font-family:var(--mono);font-size:10px;letter-spacing:2px;margin-bottom:10px}
.edge-col.open h3{color:var(--green)}
.edge-col.threat h3{color:var(--red)}
.edge-col.watch h3{color:var(--yellow)}
.edge-col.open{border-color:rgba(194,217,76,.3);background:linear-gradient(180deg,var(--green-dim),var(--surface) 50%)}
.edge-col.threat{border-color:rgba(255,143,64,.3);background:linear-gradient(180deg,var(--red-dim),var(--surface) 50%)}
.edge-col.watch{border-color:rgba(255,180,84,.3);background:linear-gradient(180deg,var(--yellow-dim),var(--surface) 50%)}
.edge-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.45}
.edge-item:last-child{border-bottom:none}
.edge-item .t{font-weight:600;margin-bottom:3px}
.edge-item .d{color:var(--text-dim);font-size:11px}

/* HIDDEN LEVERAGE */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.hl{background:var(--surface);border:1px solid rgba(210,166,255,.35);border-radius:10px;padding:14px 16px;position:relative}
.hl:before{content:'NON-OBVIOUS';position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--purple);border:1px solid rgba(210,166,255,.4);padding:2px 6px;border-radius:99px}
.hl .depth{font-family:var(--mono);font-size:10px;color:var(--purple);margin-bottom:6px}
.hl .ttl{font-size:14px;font-weight:600;margin-bottom:8px;padding-right:90px;line-height:1.35}
.hl .base{font-size:11px;color:var(--text-dim);margin-bottom:6px}
.hl .base b{color:var(--red);font-weight:500}
.hl .reframe{font-size:12px;line-height:1.5;margin-bottom:8px}
.hl .models{font-family:var(--mono);font-size:10px;color:var(--text-dim)}

/* POSITION AFTER — compare */
.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
@media(max-width:800px){.compare{grid-template-columns:1fr;}}
.cmp{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.cmp.after{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-dim),var(--surface) 40%)}
.cmp h3{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);margin-bottom:10px}
.cmp.after h3{color:var(--accent)}
.cmp .h{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:10px}
.delta-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0}
.delta-row .name{width:90px;color:var(--text-dim);font-family:var(--mono);font-size:10px}
.delta-bar{flex:1;height:8px;background:var(--border);border-radius:99px;overflow:hidden;position:relative}
.delta-bar .b,.delta-bar .a{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.delta-bar .b{background:rgba(107,132,153,.5)}
.delta-bar .a{background:var(--accent)}
.delta-row .chg{font-family:var(--mono);font-size:10px;color:var(--green);width:90px;text-align:right}
.cmp-mid{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:20px;color:var(--accent)}
@media(max-width:800px){.cmp-mid{display:none}}
.oc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:11px}
.oc div{padding:8px;border-radius:6px;background:rgba(0,0,0,.2)}
.oc .o{border-left:2px solid var(--green)}
.oc .c{border-left:2px solid var(--red)}
.oc b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text-dim);margin-bottom:4px}

/* CAMPAIGNS trees */
.camp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.camp{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.camp .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.camp .name{font-weight:600;font-size:13px}
.camp .st{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:99px;border:1px solid}
.st-advancing{color:var(--green);border-color:var(--green)}
.st-stalled{color:var(--yellow);border-color:var(--yellow)}
.st-dormant,.st-blocked{color:var(--text-dim);border-color:var(--border)}
.camp .dist{font-size:11px;color:var(--text-dim);margin-bottom:10px}
.tree{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tn{font-family:var(--mono);font-size:10px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);color:var(--text-dim)}
.tn.now,.tn.running{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.tn.next,.tn.building{color:var(--yellow);border-color:var(--yellow)}
.tn.done{color:var(--green);border-color:var(--green)}
.tn.gated,.tn.option,.tn.armed{color:var(--purple);border-color:rgba(210,166,255,.4)}
.tn.missing,.tn.blocked,.tn.future{opacity:.45}
.te{color:var(--border);font-size:12px}
.camp .note{font-size:11px;color:var(--text-dim);line-height:1.4;border-top:1px solid var(--border);padding-top:8px}
.camp .pbar{height:4px;background:var(--border);border-radius:99px;margin:8px 0;overflow:hidden}
.camp .pbar i{display:block;height:100%;background:var(--accent)}

/* COUNCIL DISAGREEMENT */
.council{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.council .sum{font-size:13px;line-height:1.55;margin-bottom:14px;padding:12px;background:rgba(0,0,0,.25);border-radius:8px;border-left:3px solid var(--accent)}
.cv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.cv{border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.cv .role{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--text-dim);margin-bottom:4px}
.cv .fav{font-size:12px;font-weight:600;margin-bottom:4px;color:var(--accent)}
.cv.rt .fav{color:var(--red)}
.cv.adj .fav{color:var(--green)}
.cv .why{font-size:11px;color:var(--text-dim);line-height:1.4}

/* PREDICTIONS + DEBRIEF */
.bot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.bot{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.panel h3{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text-dim);padding:5px 6px;border-bottom:1px solid var(--border)}
td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.4}
tr:last-child td{border-bottom:none}
.pill{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:99px;border:1px solid}
.pill-pending{color:var(--yellow);border-color:var(--yellow)}
.pill-supported{color:var(--green);border-color:var(--green)}
.pill-failed{color:var(--red);border-color:var(--red)}
.pill-unverifiable{color:var(--text-dim);border-color:var(--border)}
.upd{font-size:12px;color:var(--text-dim);line-height:1.55;margin-top:10px}
.prov{font-family:var(--mono);font-size:10px;color:var(--text-dim);line-height:1.7;margin-top:18px;padding-top:12px;border-top:1px solid var(--border)}
#error{display:none;color:var(--red);font-family:var(--mono);padding:20px}
.disc{margin-top:18px}
.disc summary{cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);list-style:none;padding:8px 0}
.disc summary::-webkit-details-marker{display:none}
.disc summary:hover{color:var(--accent)}
.disc[open] summary{color:var(--accent);margin-bottom:10px}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h1>◆ THE BOARD</h1>
    <div class="sub">Personal Strategy OS · <span id="gen"></span> · <span id="fp"></span></div>
  </div>
  <a class="back" href="/">← Dashboard</a>
</div>
<div class="flow">
  <span class="on">CURRENT POSITION</span><span class="arr">→</span>
  <span class="on">BEST MOVE NOW</span><span class="arr">→</span>
  <span class="on">RUNNING IN PARALLEL</span><span class="arr">→</span>
  <span class="on">WHAT OPENS NEXT</span>
</div>
<div id="error"></div>
<div id="app"></div>

<script>
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function pill(r){return '<span class="pill pill-'+esc(r)+'">'+esc(r)+'</span>'}
function pct(x){return Math.round((x||0)*100)}

function render(d){
  document.getElementById('gen').textContent=(d.generated_at||'').slice(0,10);
  document.getElementById('fp').textContent=(d.fingerprint||'').slice(0,12)+'…';
  var p=d.position||{}, m=d.moves||{}, dec=(d.decisions&&d.decisions[0])||{}, pa=d.position_after||{};
  var h='';

  // ===== 1. CURRENT POSITION =====
  h+='<div class="sec">Current position</div>';
  h+='<div class="territory">';
  (p.territory||[]).forEach(function(t){
    h+='<div class="cell '+esc(t.status)+'"><div class="fill" style="height:'+pct(t.fill)+'%"></div>';
    h+='<div class="lab">'+esc(t.label)+'</div><div class="pct">'+pct(t.fill)+'%</div>';
    h+='<div class="note">'+esc(t.note)+'</div></div>';
  });
  h+='</div>';
  h+='<div class="pos-meta">';
  h+='<div class="meta-card"><h3>Board state</h3>';
  h+='<div class="headline">'+esc(p.headline)+'</div>';
  h+='<div class="momentum mom-'+(p.momentum||'flat')+'">● '+(p.momentum||'?').toUpperCase()+' MOMENTUM</div>';
  var v=p.vector||{};
  h+='<div class="vec">';
  h+='<div class="v"><b>'+esc(v.completions_30d)+'</b>done/30d</div>';
  h+='<div class="v"><b>'+esc(v.wip)+'</b>wip</div>';
  h+='<div class="v"><b>'+esc(v.wip_mean_age_days)+'d</b>mean age</div>';
  h+='<div class="v"><b style="color:'+(v.compounding_share_30d>0?'var(--green)':'var(--red)')+'">'+pct(v.compounding_share_30d)+'%</b>compounding</div>';
  h+='</div></div>';
  h+='<div class="meta-card"><h3>Resources</h3>';
  (p.resources||[]).forEach(function(r){
    h+='<div class="meta-row"><span class="l">'+esc(r.label)+'</span><span class="r lvl-'+esc(r.level)+'">'+esc(r.level)+'</span></div>';
  });
  h+='</div>';
  h+='<div class="meta-card"><h3>Hard constraints</h3>';
  (p.constraints_visual||[]).forEach(function(c){
    h+='<div class="meta-row"><span class="l">'+esc(c.label)+'</span><span class="r">'+esc(c.kind)+'</span></div>';
  });
  h+='</div></div>';

  // ===== 2. BEST MOVE NOW =====
  h+='<div class="sec">Best move now</div>';
  (m.primary||[]).forEach(function(mv){
    h+='<div class="primary">';
    h+='<div class="tag">PRIMARY · '+esc(mv.class)+' · ATTENTION-INTENSIVE</div>';
    h+='<h2>'+esc(mv.title)+'</h2>';
    h+='<div class="grid">';
    h+='<div class="field"><div class="k">WHY NOW</div><div class="v">'+esc(mv.why_now)+'</div></div>';
    h+='<div class="field"><div class="k">LEVERAGE</div><div class="v">'+esc(mv.leverage)+'</div></div>';
    h+='<div class="field"><div class="k">EFFORT</div><div class="v">'+esc(mv.effort)+'</div></div>';
    h+='<div class="field"><div class="k">RISK</div><div class="v">'+esc(mv.risk)+'</div></div>';
    h+='<div class="field"><div class="k">EXPECTED POSITION GAIN</div><div class="v">'+esc(mv.expected_position_gain||mv.position_change)+'</div></div>';
    h+='<div class="field"><div class="k">STOP CONDITION</div><div class="v">'+esc(mv.stop_condition)+'</div></div>';
    h+='</div>';
    h+='<div class="execute"><div class="k">▶ EXECUTE</div><div class="v">'+esc(mv.execute||mv.next_24h)+'</div>';
    h+='<div class="done">done when: '+esc(mv.done_when)+'</div></div>';
    h+='</div>';
  });

  // ===== HIDDEN LEVERAGE (right under primary — prove non-obvious) =====
  if(d.hidden_leverage&&d.hidden_leverage.length){
    h+='<div class="sec">Hidden leverage · non-obvious moves</div>';
    h+='<div class="hl-grid">';
    d.hidden_leverage.forEach(function(hl){
      h+='<div class="hl"><div class="depth">DEPTH '+esc(hl.depth)+'</div>';
      h+='<div class="ttl">'+esc(hl.title)+'</div>';
      h+='<div class="base"><b>baseline misses:</b> '+esc(hl.baseline_missed)+'</div>';
      h+='<div class="reframe">'+esc(hl.reframe)+'</div>';
      h+='<div class="models">'+(hl.models||[]).map(esc).join(' · ')+'</div></div>';
    });
    h+='</div>';
  }

  // ===== 3. RUNNING IN PARALLEL =====
  h+='<div class="sec">Running in parallel</div>';
  h+='<div class="par-grid">';
  (m.parallel||[]).forEach(function(pr){
    var prog=pr.progress!=null?pr.progress:0;
    h+='<div class="proc '+esc(pr.class)+'">';
    h+='<div class="cls">'+esc(pr.class)+(pr.maturation?' · '+esc(pr.maturation):'')+'</div>';
    h+='<div class="ttl">'+esc(pr.title)+'</div>';
    h+='<div class="bar"><i style="width:'+pct(prog)+'%"></i></div>';
    h+='<div class="ind">'+esc(pr.indicator||pr.state)+'</div>';
    if(pr.trigger) h+='<div class="trig">trigger: '+esc(pr.trigger)+'</div>';
    if(pr.days_running) h+='<div class="trig">'+esc(pr.days_running)+(pr.target_days?' / '+esc(pr.target_days):'')+' days</div>';
    h+='</div>';
  });
  h+='</div>';

  // DO NOT TOUCH — prominent
  h+='<div style="margin-top:16px" class="dnt-wrap">';
  h+='<h3>⊘ DO NOT TOUCH — time is already working</h3>';
  h+='<div class="dnt-grid">';
  (m.do_not_touch||[]).forEach(function(x){
    h+='<div class="dnt"><div class="i">'+esc(x.item)+'</div><div class="r">'+esc(x.reason)+(x.until?' · until '+esc(x.until):'')+'</div></div>';
  });
  h+='</div></div>';

  // ===== 4. WHAT OPENS NEXT =====
  h+='<div class="sec">What opens next · edge of the board</div>';
  h+='<div class="edge">';
  h+='<div class="edge-col open"><h3>◈ Openings</h3>';
  (d.openings||[]).forEach(function(o){
    h+='<div class="edge-item"><div class="t">'+esc(o.what)+'</div><div class="d">window '+esc(o.window)+' · needs '+esc(o.prerequisite)+'</div></div>';
  });
  h+='</div>';
  h+='<div class="edge-col threat"><h3>⚠ Threats</h3>';
  (d.threats||[]).forEach(function(t){
    h+='<div class="edge-item"><div class="t">'+esc(t.what)+'</div><div class="d">'+esc(t.impact)+' · warn: '+esc(t.early_warning)+'</div></div>';
  });
  h+='</div>';
  h+='<div class="edge-col watch"><h3>◉ Watch for</h3>';
  (d.watch_for||[]).forEach(function(w){
    h+='<div class="edge-item"><div class="t">'+esc(w.condition)+'</div><div class="d">→ '+esc(w.then)+'</div></div>';
  });
  h+='</div></div>';

  // POSITION AFTER MOVE
  h+='<div class="sec">Position after move</div>';
  h+='<div class="compare">';
  h+='<div class="cmp"><h3>Current board</h3><div class="h">'+esc(p.headline)+'</div>';
  (pa.territory_delta||[]).forEach(function(t){
    h+='<div class="delta-row"><span class="name">'+esc(t.label)+'</span><div class="delta-bar"><span class="b" style="width:'+pct(t.before)+'%"></span></div><span class="chg">'+pct(t.before)+'%</span></div>';
  });
  h+='</div>';
  h+='<div class="cmp-mid">⇒</div>';
  h+='<div class="cmp after"><h3>After best move</h3><div class="h">'+esc(pa.headline||'')+'</div>';
  (pa.territory_delta||[]).forEach(function(t){
    h+='<div class="delta-row"><span class="name">'+esc(t.label)+'</span><div class="delta-bar"><span class="b" style="width:'+pct(t.before)+'%"></span><span class="a" style="width:'+pct(t.after)+'%"></span></div><span class="chg">'+esc(t.change)+'</span></div>';
  });
  h+='<div class="oc"><div class="o"><b>OPENS</b>'+(pa.opens||[]).map(esc).join('<br>')+'</div>';
  h+='<div class="c"><b>CLOSES</b>'+(pa.closes||[]).map(esc).join('<br>')+'</div></div>';
  h+='</div></div>';

  // CAMPAIGNS (expandable)
  h+='<details class="disc"><summary>▸ CAMPAIGNS · move trees &amp; dependencies</summary>';
  h+='<div class="camp-grid">';
  (d.campaigns||[]).forEach(function(c){
    h+='<div class="camp"><div class="top"><div class="name">'+esc(c.name)+'</div><span class="st st-'+esc(c.status)+'">'+esc(c.status)+'</span></div>';
    h+='<div class="dist">'+esc(c.distance)+' · '+esc(c.horizon)+'</div>';
    h+='<div class="pbar"><i style="width:'+pct(c.progress)+'%"></i></div>';
    if(c.tree){
      h+='<div class="tree">';
      (c.tree.nodes||[]).forEach(function(n,i){
        if(i) h+='<span class="te">→</span>';
        h+='<span class="tn '+esc(n.status)+'">'+esc(n.label)+'</span>';
      });
      h+='</div><div class="note">'+esc(c.tree.note||'')+'</div>';
    }
    h+='</div>';
  });
  h+='</div></details>';

  // COUNCIL DISAGREEMENT
  h+='<details class="disc"><summary>▸ COUNCIL · disagreement &amp; adjudication</summary>';
  h+='<div class="council">';
  if(dec.disagreement_summary) h+='<div class="sum">'+esc(dec.disagreement_summary)+'</div>';
  h+='<div class="cv-grid">';
  (dec.council_views||[]).forEach(function(cv){
    var cls=cv.role&&cv.role.indexOf('Red')>=0?' rt':(cv.role&&cv.role.indexOf('Adjud')>=0?' adj':'');
    h+='<div class="cv'+cls+'"><div class="role">'+esc(cv.role)+'</div><div class="fav">favors: '+esc(cv.favors)+'</div><div class="why">'+esc(cv.why)+'</div></div>';
  });
  h+='</div>';
  if(dec.alternatives&&dec.alternatives.length){
    h+='<div style="margin-top:14px;font-size:12px"><span style="font-family:var(--mono);font-size:10px;color:var(--text-dim)">ALTERNATIVES CONSIDERED</span><ul style="margin:8px 0 0 16px;line-height:1.6">';
    dec.alternatives.forEach(function(a){h+='<li>'+esc(a)+'</li>'});
    h+='</ul></div>';
  }
  h+='</div></details>';

  // PREDICTIONS + DEBRIEF
  h+='<div class="sec">Predictions · debrief · calibration</div>';
  h+='<div class="bot">';
  h+='<div class="panel"><h3>Open predictions</h3><table><thead><tr><th>ID</th><th>Claim</th><th>By</th><th></th></tr></thead><tbody>';
  (d.predictions||[]).forEach(function(pr){
    h+='<tr><td>'+esc(pr.id)+'</td><td>'+esc(pr.statement)+'</td><td>'+esc(pr.check_by)+'</td><td>'+pill(pr.result)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  var vd=d.verdict||{};
  h+='<div class="panel"><h3>Debrief</h3><table><thead><tr><th>Prior</th><th></th><th>Evidence</th></tr></thead><tbody>';
  (vd.previous_predictions||[]).forEach(function(pr){
    h+='<tr><td>'+esc(pr.statement)+'</td><td>'+pill(pr.result)+'</td><td style="color:var(--text-dim)">'+esc(pr.evidence)+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="upd">'+(vd.model_updates||[]).map(function(u){return '• '+esc(u)}).join('<br>')+'</div></div>';
  h+='</div>';

  var pv=d.provenance||{};
  h+='<div class="prov">fingerprint '+(d.fingerprint||'').slice(0,16)+'… · nodes '+esc(pv.nodes)+' · tasks '+esc(pv.tasks)+' · notes '+esc(pv.notes)+' · bodies '+esc(pv.bodies_read);
  if(pv.quality_flags&&pv.quality_flags.length) h+='<br>flags: '+pv.quality_flags.map(esc).join(' · ');
  h+='</div>';

  document.getElementById('app').innerHTML=h;
}
function fail(m){var e=document.getElementById('error');e.style.display='block';e.textContent='Board unavailable: '+m}
fetch('/api/growth-engine').then(function(r){if(!r.ok)throw new Error('api '+r.status);return r.json()}).then(render)
.catch(function(e1){fetch('data/growth-engine.json').then(function(r){if(!r.ok)throw new Error('file '+r.status);return r.json()}).then(render).catch(function(e2){fail(e1.message+' / '+e2.message)})});
</script>
</body>
</html>
