<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGMENTED INTELLIGENCE // SAI BERA</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #0a0e14; --surface: #131820; --border: #1e2a3a; --text: #b3c7d6;
    --text-dim: #556678; --accent: #39bae6; --accent-glow: rgba(57,186,230,0.15);
    --green: #c2d94c; --red: #ff8f40; --yellow: #ffb454;
    --font-mono: 'Space Mono', 'SF Mono', Consolas, monospace;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg); color: var(--text);
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
    padding: 40px 20px; max-width: 1200px; margin: 0 auto;
  }
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px;
  }
  .header-left h1 { font-family: var(--font-mono); font-size: 20px; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
  .header-left .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .header-right { text-align: right; }
  .btn-back { color: var(--text-dim); text-decoration: none; font-size: 13px; border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; transition: all 0.2s; }
  .btn-back:hover { color: var(--accent); border-color: var(--accent); }

  /* GRAPH CONTAINER */
  #graph-container {
    width: 100%; height: 500px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 40px;
    overflow: hidden; position: relative;
  }

  /* SYNTHESES CARDS */
  .section-title {
    font-family: var(--font-mono); font-size: 15px; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;
  }
  .syntheses-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 24px;
  }
  .synthesis-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .synth-header { border-bottom: 1px dashed var(--border); padding-bottom: 12px; }
  .synth-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .synth-model { font-family: var(--font-mono); font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  .synth-section { display: flex; flex-direction: column; gap: 6px; }
  .synth-label { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); text-transform: uppercase; }
  .synth-text { font-size: 14px; line-height: 1.6; color: var(--text); }
  .synth-solution { color: var(--green); }

  /* D3 TOOLTIP */
  .tooltip {
    position: absolute; text-align: center; padding: 6px 10px; font-size: 12px;
    background: #000; color: #fff; border: 1px solid var(--border); border-radius: 4px;
    pointer-events: none; opacity: 0; transition: opacity 0.2s; font-family: var(--font-mono);
  }

  @media (max-width: 768px) {
    .syntheses-grid { grid-template-columns: 1fr; }
  }

  /* === HOUSING INSIGHTS === */
  .housing-section { margin-top: 60px; border-top: 1px solid var(--border); padding-top: 40px; }
  .housing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 20px; }
  .housing-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px 24px; border-left: 4px solid var(--accent);
  }
  .housing-card.model-probabilistic-thinking { border-left-color: var(--green); }
  .housing-card.model-thinking-in-bets { border-left-color: var(--yellow); }
  .housing-card.model-euclidean-thinking { border-left-color: var(--accent); }
  .housing-card .hc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .housing-card .hc-stem-tag {
    font-family: var(--font-mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: 1.5px; padding: 3px 8px; border-radius: 3px;
    background: rgba(57,186,230,0.1); color: var(--accent);
  }
  .housing-card .hc-title { font-size: 17px; font-weight: 600; color: #fff; flex: 1; }
  .housing-card .hc-label {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
  }
  .housing-card .hc-text { font-size: 13px; line-height: 1.6; color: var(--text); margin-bottom: 12px; }
  .housing-card .hc-solution { color: var(--green); }
  @media (max-width: 768px) { .housing-grid { grid-template-columns: 1fr; } }

  /* === HIDDEN PREVIEW LABS ===
     Disabled by default. Enable with /momentum.html?labs=1. */
  .labs-only { display: none; }
  body.labs-mode .labs-only { display: block; }
  .labs-banner {
    margin: -10px 0 24px; padding: 9px 12px; border: 1px dashed var(--accent);
    border-radius: 6px; color: var(--accent); font: 11px var(--font-mono);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .labs-health {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 24px;
  }
  .labs-health-cell, .labs-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  }
  .labs-health-cell { padding: 12px 14px; }
  .labs-kicker { color: var(--text-dim); font: 9px var(--font-mono); text-transform: uppercase; letter-spacing: 1px; }
  .labs-value { color: var(--text); font: 12px var(--font-mono); margin-top: 5px; overflow-wrap: anywhere; }
  .labs-warn { color: var(--yellow); }
  .labs-bad { color: var(--red); }
  .labs-good { color: var(--green); }
  .labs-panel { padding: 20px; margin-bottom: 24px; }
  .labs-current-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
  .labs-current-title { color: #fff; font-size: 17px; margin-bottom: 8px; }
  .labs-current-copy { color: var(--text); font-size: 13px; line-height: 1.65; }
  .labs-action { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.5; }
  .labs-action:last-child { border-bottom: 0; }
  .labs-link { color: var(--accent); font: 11px var(--font-mono); }
  .node-detail {
    position: fixed; top: 20px; right: 20px; width: min(420px, calc(100vw - 40px));
    max-height: calc(100vh - 40px); overflow: auto; z-index: 20;
    background: #0d1219; border: 1px solid var(--accent); border-radius: 8px;
    padding: 20px; box-shadow: 0 16px 60px rgba(0,0,0,.55);
  }
  .node-detail-close { float: right; color: var(--text-dim); cursor: pointer; font: 16px var(--font-mono); }
  .node-detail-title { color: #fff; font-size: 18px; margin: 8px 0 4px; }
  .node-detail-meta { color: var(--accent); font: 10px var(--font-mono); text-transform: uppercase; margin-bottom: 14px; }
  .node-detail-copy { white-space: pre-wrap; font-size: 12px; line-height: 1.6; margin-top: 10px; }
  body.labs-mode .graph-label { opacity: .22; }
  body.labs-mode .graph-label.is-neighbor { opacity: 1; }
  @media (max-width: 768px) {
    .labs-current-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>◆ AUGMENTED INTELLIGENCE</h1>
    <div class="subtitle" id="data-status">Live Graph Sync & Synthesis Engine</div>
  </div>
  <div class="header-right">
    <a href="/" class="btn-back">Return to Dashboard</a>
  </div>
</div>

<div class="labs-only" id="labs-shell">
  <div class="labs-banner">Preview layer · hidden by default · no existing components removed</div>
  <div class="labs-health" id="labs-health"></div>
  <div class="labs-panel" id="labs-current"></div>
</div>

<div id="graph-container"></div>
<div class="tooltip" id="tooltip"></div>
<div class="labs-only node-detail" id="node-detail" style="display:none"></div>

<div class="section-title">Novel Syntheses & Emergent Solutions</div>
<div class="syntheses-grid" id="syntheses-container">
  <!-- Filled by JS -->
</div>

<div class="housing-section">
  <div class="section-title">🏠 Housing Insights · STEM-Synthesized</div>
  <div class="housing-grid" id="housing-container">
    <!-- Filled by JS -->
    <div style="padding:20px;color:var(--text-dim);">Loading housing insights...</div>
  </div>
</div>

<script>
  const labsMode = new URLSearchParams(window.location.search).get('labs') === '1';
  if (labsMode) document.body.classList.add('labs-mode');

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function safeText(value) {
    return escapeHtml(value).replace(/\n/g, '<br>');
  }

  function formatDate(value) {
    if (!value) return 'unknown';
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? escapeHtml(value) : d.toLocaleString();
  }

  function renderSyntheses(syntheses) {
    const container = document.getElementById('syntheses-container');
    container.innerHTML = '';

    syntheses.forEach(s => {
      const card = document.createElement('div');
      card.className = 'synthesis-card';

      let html = `<div class="synth-header">
        <div class="synth-title">${escapeHtml(s.title)}</div>
        <div class="synth-model">STEM Model: ${escapeHtml(s.model)}</div>
      </div>`;

      if (s.problem) {
        html += `<div class="synth-section">
          <div class="synth-label">The Axiom / Bottleneck</div>
          <div class="synth-text">${safeText(s.problem)}</div>
        </div>`;
      }

      if (s.solution) {
        html += `<div class="synth-section">
          <div class="synth-label">Novel Solution / Strategy</div>
          <div class="synth-text synth-solution">${safeText(s.solution)}</div>
        </div>`;
      }

      if (labsMode) {
        html += `<div class="labs-kicker">${s.is_current ? 'Canonical current synthesis' : 'Durable insight'} · Updated ${formatDate(s.updated_at)}</div>`;
      }
      card.innerHTML = html;
      container.appendChild(card);
    });
  }

  function renderHousingInsights(syntheses) {
    const container = document.getElementById('housing-container');
    container.innerHTML = '';

    if (!syntheses || syntheses.length === 0) {
      container.innerHTML = '<div style="padding:20px;color:var(--text-dim);">No housing insights available.</div>';
      return;
    }

    syntheses.forEach(s => {
      const card = document.createElement('div');
      const model = String(s.model || 'Unknown');
      const modelClass = model.toLowerCase().replace(/\s+/g, '-');
      card.className = 'housing-card model-' + modelClass;

      let html = '<div class="hc-header">';
      html += '<span class="hc-stem-tag">' + escapeHtml(model) + '</span>';
      html += '<span class="hc-title">' + escapeHtml(s.title) + '</span>';
      html += '</div>';

      if (s.problem) {
        html += '<div class="hc-label">Problem / Axiom</div>';
        html += '<div class="hc-text">' + safeText(s.problem) + '</div>';
      }

      if (s.solution) {
        html += '<div class="hc-label">Solution / Strategy</div>';
        html += '<div class="hc-text hc-solution">' + safeText(s.solution) + '</div>';
      }

      card.innerHTML = html;
      container.appendChild(card);
    });
  }

  async function loadHousingInsights() {
    const container = document.getElementById('housing-container');
    try {
      const res = await fetch('/api/housing-graph');
      if (!res.ok) throw new Error('API Error');
      const data = await res.json();
      renderHousingInsights(data.syntheses || []);
    } catch(e) {
      container.innerHTML = '<div style="padding:20px;color:var(--red);">Housing insights unavailable. Run generate-housing-graph.py to refresh.</div>';
    }
  }

  async function loadLabs(graphData) {
    if (!labsMode) return;
    const health = document.getElementById('labs-health');
    const current = document.getElementById('labs-current');
    try {
      const stateRes = await fetch('/api/state');
      if (!stateRes.ok) throw new Error('state API ' + stateRes.status);
      const state = await stateRes.json();
      const ma = state.momentum_analysis || {};
      const graphMeta = graphData.meta || {};
      const warnings = graphMeta.warnings || [];
      const graphAge = graphMeta.generated_at ? Math.floor((Date.now() - new Date(graphMeta.generated_at).getTime()) / 86400000) : null;
      const momentumAge = ma.last_run ? Math.floor((Date.now() - new Date(ma.last_run).getTime()) / 86400000) : null;

      const cells = [
        ['Graph snapshot', formatDate(graphMeta.generated_at), graphAge != null && graphAge > 14 ? 'labs-warn' : 'labs-good'],
        ['Momentum analysis', formatDate(ma.last_run), momentumAge != null && momentumAge > 14 ? 'labs-bad' : 'labs-good'],
        ['Graph integrity', `${graphMeta.node_count || graphData.nodes.length} nodes · ${warnings.length} warning(s)`, warnings.length ? 'labs-warn' : 'labs-good'],
        ['Source fingerprint', graphMeta.source_fingerprint ? graphMeta.source_fingerprint.slice(0, 12) : 'legacy schema', ''],
      ];
      health.innerHTML = cells.map(c => `<div class="labs-health-cell"><div class="labs-kicker">${escapeHtml(c[0])}</div><div class="labs-value ${c[2]}">${escapeHtml(c[1])}</div></div>`).join('');

      const bottleneck = typeof ma.bottleneck === 'object' ? ma.bottleneck.what : ma.bottleneck;
      const actions = Array.isArray(ma.top_actions) ? ma.top_actions : [];
      current.innerHTML = `<div class="section-title">Hidden Preview · Current Operating Synthesis</div>
        <div class="labs-current-grid">
          <div>
            <div class="labs-kicker">Current constraint</div>
            <div class="labs-current-title">${escapeHtml(bottleneck || 'No validated current constraint')}</div>
            <div class="labs-current-copy">${escapeHtml((ma.bottleneck && ma.bottleneck.why) || 'The preview intentionally exposes freshness gaps instead of presenting stale analysis as live.')}</div>
            <div style="margin-top:14px"><a class="labs-link" href="/momentum-analysis.html">Open hidden full Momentum analysis →</a></div>
          </div>
          <div><div class="labs-kicker">Current action queue</div>${actions.length ? actions.map((a, i) => `<div class="labs-action"><strong>${i + 1}.</strong> ${escapeHtml(a.action || a.step || '')}<br><span class="labs-kicker">${escapeHtml(a.time || '')} ${a.status ? '· ' + escapeHtml(a.status) : ''}</span></div>`).join('') : '<div class="labs-current-copy">No validated actions available.</div>'}</div>
        </div>`;
    } catch (e) {
      health.innerHTML = `<div class="labs-health-cell"><div class="labs-kicker">Preview health</div><div class="labs-value labs-bad">${escapeHtml(e.message)}</div></div>`;
      current.innerHTML = '<div class="labs-current-copy">Current synthesis unavailable.</div>';
    }
  }

  function showNodeDetail(node, graphData) {
    if (!labsMode) return;
    const panel = document.getElementById('node-detail');
    const synthesis = (graphData.syntheses || []).find(s => s.id === node.id);
    panel.innerHTML = `<span class="node-detail-close" id="node-detail-close">×</span>
      <div class="labs-kicker">${escapeHtml(node.group || 'node')}</div>
      <div class="node-detail-title">${escapeHtml(node.label || node.id)}</div>
      <div class="node-detail-meta">${synthesis ? escapeHtml(synthesis.model || '') + ' · ' + formatDate(synthesis.updated_at) : 'Graph relationship node'}</div>
      ${synthesis && synthesis.problem ? `<div class="labs-kicker">Problem / axiom</div><div class="node-detail-copy">${escapeHtml(synthesis.problem)}</div>` : ''}
      ${synthesis && synthesis.solution ? `<div class="labs-kicker" style="margin-top:16px">Strategy</div><div class="node-detail-copy labs-good">${escapeHtml(synthesis.solution)}</div>` : ''}`;
    panel.style.display = 'block';
    document.getElementById('node-detail-close').onclick = () => panel.style.display = 'none';
  }

  function renderGraph(data) {
    const container = document.getElementById('graph-container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const svg = d3.select("#graph-container")
      .append("svg")
      .attr("width", "100%")
      .attr("height", "100%")
      .call(d3.zoom().on("zoom", function (event) {
         g.attr("transform", event.transform);
      }));

    const g = svg.append("g");
    const tooltip = d3.select("#tooltip");

    const simulation = d3.forceSimulation(data.nodes)
      .force("link", d3.forceLink(data.links).id(d => d.id).distance(150))
      .force("charge", d3.forceManyBody().strength(-400))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide().radius(50));

    // Lines
    const link = g.append("g")
      .attr("stroke", "var(--border)")
      .attr("stroke-opacity", 0.6)
      .attr("stroke-width", 2)
      .selectAll("line")
      .data(data.links)
      .join("line");

    // Nodes
    const node = g.append("g")
      .attr("stroke", "#fff")
      .attr("stroke-width", 1.5)
      .selectAll("circle")
      .data(data.nodes)
      .join("circle")
      .attr("r", d => d.group === "concept" ? 12 : 8)
      .attr("fill", d => d.group === "concept" ? "var(--accent)" : "var(--green)")
      .call(drag(simulation));

    // Labels
    const label = g.append("g")
      .selectAll("text")
      .data(data.nodes)
      .join("text")
      .attr("class", "graph-label")
      .text(d => d.label || d.id)
      .attr("font-size", "12px")
      .attr("fill", "var(--text)")
      .attr("dx", 15)
      .attr("dy", 4)
      .style("pointer-events", "none");

    // Hover Tooltips
    node.on("mouseover", (event, d) => {
      tooltip.style("opacity", 1)
             .html(`<b>${escapeHtml(d.label || d.id)}</b><br>Type: ${escapeHtml(d.group)}`)
             .style("left", (event.pageX + 10) + "px")
             .style("top", (event.pageY - 28) + "px");
      d3.select(event.currentTarget).attr("stroke", "var(--yellow)").attr("stroke-width", 3);
      if (labsMode) {
        const neighbors = new Set([d.id]);
        data.links.forEach(l => {
          const source = typeof l.source === 'object' ? l.source.id : l.source;
          const target = typeof l.target === 'object' ? l.target.id : l.target;
          if (source === d.id) neighbors.add(target);
          if (target === d.id) neighbors.add(source);
        });
        label.classed('is-neighbor', n => neighbors.has(n.id));
      }
    })
    .on("mouseout", (event) => {
      tooltip.style("opacity", 0);
      d3.select(event.currentTarget).attr("stroke", "#fff").attr("stroke-width", 1.5);
      if (labsMode) label.classed('is-neighbor', false);
    })
    .on("click", (event, d) => showNodeDetail(d, data));

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);
      node
        .attr("cx", d => d.x)
        .attr("cy", d => d.y);
      label
        .attr("x", d => d.x)
        .attr("y", d => d.y);
    });

    function drag(simulation) {
      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }
      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }
      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
      return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
    }
  }

  async function init() {
    try {
      const res = await fetch('/api/augmented-graph');
      if (!res.ok) throw new Error('API Error');
      const data = await res.json();
      renderGraph(data);
      renderSyntheses(data.syntheses || []);
      loadHousingInsights();
      loadLabs(data);
      const meta = data.meta || {};
      const suffix = labsMode && meta.generated_at ? ` · Snapshot ${formatDate(meta.generated_at)}` : '';
      document.getElementById('data-status').innerText = `Graph loaded: ${data.nodes.length} nodes, ${data.links.length} connections${suffix}`;
    } catch(e) {
      document.getElementById('graph-container').innerHTML = `<div style="padding:40px;text-align:center;color:var(--red);">Error loading graph data.</div>`;
      document.getElementById('data-status').innerText = 'Offline';
    }
  }

  init();
</script>
</body>
</html>
