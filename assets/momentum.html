<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUGMENTED INTELLIGENCE // SAI BERA</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #0a0e14; --surface: #131820; --border: #1e2a3a; --text: #b3c7d6;
    --text-dim: #7190a2; --accent: #39bae6; --accent-glow: rgba(57,186,230,0.15);
    --green: #c2d94c; --red: #ff8f40; --yellow: #ffb454;
    --font-mono: 'Space Mono', 'SF Mono', Consolas, monospace;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg); color: var(--text);
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
    padding: 40px 20px; max-width: 1200px; margin: 0 auto;
  }
  .header {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px;
  }
  .header-left h1 { font-family: var(--font-mono); font-size: 20px; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
  .header-left .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .header-right { text-align: right; }
  .btn-back { color: var(--text-dim); text-decoration: none; font-size: 13px; border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; transition: all 0.2s; }
  .btn-back:hover { color: var(--accent); border-color: var(--accent); }

  /* GRAPH CONTAINER */
  #graph-container {
    width: 100%; height: 640px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
    overflow: hidden; position: relative;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .graph-node:focus { outline: none; stroke: var(--yellow); stroke-width: 3px; }
  .graph-text-alternative { margin: 0 0 40px; border: 1px solid var(--border); border-radius: 7px; background: rgba(19, 24, 32, 0.65); color: var(--text-dim); }
  .graph-text-alternative summary { cursor: pointer; padding: 10px 13px; color: #91a8b8; font: 10px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: 0.7px; }
  .graph-outline { padding: 2px 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
  .graph-outline-group h3 { margin: 8px 0 6px; color: var(--accent); font: 11px/1.4 var(--font-mono); text-transform: uppercase; }
  .graph-outline-group ul { padding-left: 18px; }
  .graph-outline-group li { margin: 4px 0; color: #a9bac5; font-size: 12px; line-height: 1.5; }
  .graph-outline-relations { grid-column: 1 / -1; color: #91a8b8; font-size: 12px; line-height: 1.5; }
  .graph-legend {
    position: absolute; z-index: 2; left: 14px; top: 14px;
    display: flex; flex-wrap: wrap; gap: 6px 10px; max-width: calc(100% - 28px);
    padding: 8px 10px; border: 1px solid rgba(85, 102, 120, 0.25); border-radius: 7px;
    background: rgba(10, 14, 20, 0.82); backdrop-filter: blur(8px);
  }
  .graph-legend-item { display: inline-flex; align-items: center; gap: 5px; color: #8195a5; font: 9px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; }
  .graph-legend-dot { width: 7px; height: 7px; border-radius: 50%; }
  .graph-label { paint-order: stroke; stroke: rgba(10, 14, 20, 0.95); stroke-width: 3px; stroke-linejoin: round; }

  /* SYNTHESES CARDS */
  .section-title {
    font-family: var(--font-mono); font-size: 15px; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;
  }
  .syntheses-grid { display: block; }
  .synthesis-columns { columns: 2; column-gap: 22px; }
  .synthesis-card {
    position: relative; overflow: hidden; break-inside: avoid;
    width: 100%; margin: 0 0 22px; display: inline-flex;
    background: linear-gradient(145deg, rgba(19, 24, 32, 0.98), rgba(14, 19, 27, 0.98));
    border: 1px solid var(--border); border-radius: 12px;
    padding: 0; flex-direction: column;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
  }
  .synthesis-card::before {
    content: ''; position: absolute; inset: 0 0 auto; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent 72%); opacity: 0.48;
  }
  .synthesis-card.is-current {
    display: flex; border-color: rgba(57, 186, 230, 0.38);
    box-shadow: 0 16px 42px rgba(0, 0, 0, 0.22), 0 0 28px rgba(57, 186, 230, 0.05);
  }
  .synth-header { padding: 22px 24px 18px; border-bottom: 1px solid rgba(85, 102, 120, 0.22); }
  .synth-heading-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .synth-title { font-size: 19px; line-height: 1.28; font-weight: 650; color: #f3f7fa; letter-spacing: -0.01em; }
  .synth-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: 0 0 auto; }
  .synth-badge {
    padding: 4px 7px; border: 1px solid rgba(57, 186, 230, 0.22); border-radius: 999px;
    color: var(--accent); background: rgba(57, 186, 230, 0.07);
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.7px; text-transform: uppercase;
  }
  .synth-models { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .model-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 7px; border-radius: 5px; background: rgba(57, 186, 230, 0.07);
    color: #8bd8f2; font-family: var(--font-mono); font-size: 10px; line-height: 1.2;
    letter-spacing: 0.55px; text-transform: uppercase;
  }
  .model-chip::before { content: '◆'; font-size: 6px; color: var(--accent); }
  .synth-body { display: grid; gap: 0; }
  .is-current .synth-body { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .synth-section { padding: 22px 24px 25px; min-width: 0; }
  .synth-section + .synth-section { border-top: 1px solid rgba(85, 102, 120, 0.16); }
  .is-current .synth-section + .synth-section { border-top: 0; border-left: 1px solid rgba(85, 102, 120, 0.22); }
  .synth-label {
    display: flex; align-items: center; gap: 9px; margin-bottom: 12px;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.9px;
  }
  .synth-label::before { content: ''; width: 16px; height: 1px; background: currentColor; }
  .synth-section.solution .synth-label { color: #91a936; }
  .synth-text { font-size: 14.5px; line-height: 1.72; color: #bfd0dc; overflow-wrap: anywhere; }
  .synth-text p + p { margin-top: 13px; }
  .synth-text strong { color: #eef5f8; font-weight: 650; }
  .synth-text em { color: #dbe7ed; }
  .synth-text ul, .synth-text ol { margin: 10px 0 12px; padding-left: 1.35rem; }
  .synth-text li { padding-left: 4px; margin: 6px 0; }
  .synth-text li::marker { color: var(--accent); font-family: var(--font-mono); }
  .synth-section.solution .synth-text li::marker { color: var(--green); }
  .synth-section.solution .synth-text strong { color: #d9ea72; }
  .synth-disagreement { padding: 15px 24px 18px; border-top: 1px solid rgba(255, 180, 84, 0.2); background: rgba(255, 180, 84, 0.035); }
  .synth-disagreement .synth-label { margin-bottom: 8px; color: var(--yellow); }
  .synth-disagreement .synth-text { color: #c8d1d6; font-size: 12.5px; line-height: 1.6; }
  .synth-context { padding: 22px 24px 24px; border-top: 1px solid rgba(57, 186, 230, 0.2); background: rgba(57, 186, 230, 0.025); }
  .context-grid { display: grid; gap: 11px; }
  .context-application { padding: 14px 15px; border: 1px solid rgba(85, 102, 120, 0.22); border-radius: 8px; background: rgba(10, 15, 22, 0.55); }
  .context-source { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
  .context-source-name { color: #e8f0f4; font-size: 13px; font-weight: 650; }
  .context-source-type, .context-state { padding: 3px 6px; border-radius: 999px; font: 8px/1.2 var(--font-mono); letter-spacing: 0.55px; text-transform: uppercase; }
  .context-source-type { background: rgba(57, 186, 230, 0.08); color: #8bd8f2; }
  .context-application-text { color: #bfd0dc; font-size: 13px; line-height: 1.62; }
  .context-implication { margin-top: 9px; padding-left: 10px; border-left: 2px solid var(--green); color: #c7d88a; font-size: 12px; line-height: 1.55; }
  .context-refs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .context-ref { padding: 2px 5px; border-radius: 4px; background: rgba(113, 144, 162, 0.08); color: #8fa5b3; font: 8px/1.35 var(--font-mono); }
  .context-decision { margin-top: 14px; padding: 14px 15px; border: 1px solid rgba(255, 180, 84, 0.22); border-radius: 8px; background: rgba(255, 180, 84, 0.035); }
  .context-decision-choice { color: #f0c37f; font-size: 13.5px; font-weight: 650; line-height: 1.5; }
  .context-decision-row { margin-top: 6px; color: #b7c6cf; font-size: 12px; line-height: 1.55; }
  .context-decision-row strong { color: #dce6eb; }
  .context-actions { display: grid; gap: 8px; margin-top: 14px; }
  .context-action { padding: 12px 13px; border: 1px solid rgba(194, 217, 76, 0.18); border-radius: 7px; background: rgba(194, 217, 76, 0.025); }
  .context-action-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 9px; }
  .context-action-title { color: #e7eef2; font-size: 12.5px; font-weight: 650; line-height: 1.4; }
  .context-state.current { background: rgba(57, 186, 230, 0.09); color: #8bd8f2; }
  .context-state.conditional { background: rgba(194, 217, 76, 0.08); color: #cddd76; }
  .context-action-move { margin-top: 6px; color: #b8c8d1; font-size: 12px; line-height: 1.55; }
  .context-action-done { margin-top: 5px; color: #aebe82; font-size: 11px; line-height: 1.5; }
  .rich-heading {
    margin: 18px 0 8px; color: #e9f1f5; font-size: 13px; line-height: 1.4;
    font-weight: 650; letter-spacing: 0.01em;
  }
  .rich-heading:first-child { margin-top: 0; }
  .synth-text code {
    padding: 2px 5px; border: 1px solid rgba(57, 186, 230, 0.15); border-radius: 4px;
    background: rgba(57, 186, 230, 0.07); color: #a9e2f5; font: 0.88em/1.4 var(--font-mono);
  }
  .synth-text pre {
    margin: 11px 0; padding: 13px 15px; overflow-x: auto;
    border: 1px solid rgba(85, 102, 120, 0.3); border-radius: 7px;
    background: #0a0f16; color: #c8d6df; font: 12px/1.62 var(--font-mono); white-space: pre-wrap;
  }
  .synth-text pre code { padding: 0; border: 0; background: none; color: inherit; }
  .wiki-ref {
    display: inline-block; margin: 1px 2px; padding: 1px 6px; border-radius: 999px;
    background: rgba(194, 217, 76, 0.08); border: 1px solid rgba(194, 217, 76, 0.18);
    color: #d1e66d; font-size: 0.9em;
  }
  .math-inline { font-family: var(--font-mono); color: #d7e3e9; }

  /* EXECUTION BLUEPRINT */
  .blueprint-shell { margin-top: 48px; }
  .blueprint {
    overflow: hidden; border: 1px solid rgba(57, 186, 230, 0.34); border-radius: 14px;
    background: linear-gradient(155deg, rgba(16, 23, 32, 0.99), rgba(9, 14, 21, 0.99));
    box-shadow: 0 20px 52px rgba(0, 0, 0, 0.24), 0 0 32px rgba(57, 186, 230, 0.04);
  }
  .blueprint-header { padding: 26px 28px 24px; border-bottom: 1px solid rgba(85, 102, 120, 0.24); }
  .blueprint-heading-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .blueprint-kicker { margin-bottom: 7px; color: var(--accent); font: 10px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 1.1px; }
  .blueprint-title { color: #f4f8fa; font-size: 24px; line-height: 1.25; letter-spacing: -0.02em; }
  .blueprint-timeframe { flex: 0 0 auto; padding: 6px 9px; border: 1px solid rgba(57, 186, 230, 0.25); border-radius: 999px; background: rgba(57, 186, 230, 0.07); color: #8bd8f2; font: 10px/1.2 var(--font-mono); }
  .blueprint-objective { max-width: 850px; margin-top: 13px; color: #bfd0dc; font-size: 14.5px; line-height: 1.65; }
  .blueprint-constraint { margin-top: 16px; padding: 11px 13px; border-left: 2px solid var(--yellow); background: rgba(255, 180, 84, 0.05); color: #c9d5dc; font-size: 13px; line-height: 1.55; }
  .blueprint-constraint strong { color: var(--yellow); }
  .blueprint-rules { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
  .blueprint-rule { padding: 5px 8px; border-radius: 5px; background: rgba(194, 217, 76, 0.07); color: #c6d86e; font: 10px/1.3 var(--font-mono); }
  .blueprint-timeline { position: relative; padding: 28px; }
  .blueprint-timeline::before { content: ''; position: absolute; left: 48px; top: 44px; bottom: 44px; width: 1px; background: linear-gradient(var(--accent), rgba(194, 217, 76, 0.5), rgba(85, 102, 120, 0.15)); }
  .blueprint-phase { position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 16px; padding-bottom: 24px; }
  .blueprint-phase:last-child { padding-bottom: 0; }
  .phase-index {
    position: relative; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px;
    border: 1px solid rgba(57, 186, 230, 0.4); border-radius: 50%; background: #0c131c;
    color: var(--accent); font: 12px/1 var(--font-mono);
  }
  .blueprint-phase.conditional .phase-index { border-color: rgba(194, 217, 76, 0.32); color: var(--green); }
  .phase-card { overflow: hidden; border: 1px solid rgba(85, 102, 120, 0.25); border-radius: 10px; background: rgba(19, 24, 32, 0.72); }
  .phase-head { padding: 17px 18px 15px; border-bottom: 1px solid rgba(85, 102, 120, 0.18); }
  .phase-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 7px; }
  .phase-horizon { color: var(--accent); font: 10px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.7px; }
  .phase-status { padding: 3px 6px; border-radius: 999px; background: rgba(57, 186, 230, 0.07); color: #7acfeb; font: 8px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.6px; }
  .blueprint-phase.conditional .phase-status { background: rgba(194, 217, 76, 0.07); color: #c2d94c; }
  .phase-title { color: #eef4f7; font-size: 17px; line-height: 1.3; }
  .phase-window { margin-top: 4px; color: var(--text-dim); font: 10px/1.3 var(--font-mono); }
  .phase-decision { padding: 14px 18px 0; color: #c3d2da; font-size: 13.5px; line-height: 1.6; }
  .phase-steps { display: grid; gap: 9px; padding: 14px 18px 16px; }
  .phase-step { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 11px 12px; border: 1px solid rgba(85, 102, 120, 0.18); border-radius: 7px; background: rgba(10, 15, 22, 0.62); }
  .step-order { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; background: rgba(57, 186, 230, 0.09); color: var(--accent); font: 10px/1 var(--font-mono); }
  .step-title { color: #e7eef2; font-size: 13px; font-weight: 650; line-height: 1.4; }
  .step-id { margin-left: 6px; color: #7190a2; font: 9px/1.3 var(--font-mono); }
  .step-detail { margin-top: 4px; color: #8ea2af; font-size: 12px; line-height: 1.5; }
  .step-done { margin-top: 5px; color: #b6c785; font-size: 11.5px; line-height: 1.5; }
  .phase-gate { padding: 12px 18px 14px; border-top: 1px solid rgba(85, 102, 120, 0.16); background: rgba(194, 217, 76, 0.035); color: #aebd8b; font-size: 12px; line-height: 1.55; }
  .phase-gate strong { color: var(--green); font: 9px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.6px; }
  .blueprint-checkpoints { padding: 0 28px 28px; }
  .checkpoint-title { margin-bottom: 12px; color: #859aa8; font: 10px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.9px; }
  .checkpoint-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .checkpoint { padding: 13px; border: 1px solid rgba(85, 102, 120, 0.2); border-radius: 8px; background: rgba(10, 15, 22, 0.54); }
  .checkpoint-at { color: var(--accent); font: 9px/1.3 var(--font-mono); }
  .checkpoint-question { margin-top: 7px; color: #c3d1d9; font-size: 12px; line-height: 1.5; }
  .checkpoint-decision { margin-top: 7px; color: #7f939f; font-size: 11.5px; line-height: 1.5; }

  /* LIFE STRATEGY BOARD */
  .strategy-board { margin-top: 44px; }
  .strategy-stack { display: grid; gap: 22px; }
  .strategy-kicker { color: var(--accent); font: 10px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 1px; }
  .strategy-position {
    overflow: hidden; padding: 28px; border: 1px solid rgba(57, 186, 230, 0.35); border-radius: 14px;
    background: radial-gradient(circle at 92% 5%, rgba(57, 186, 230, 0.09), transparent 32%), linear-gradient(145deg, #121923, #0c121a);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
  }
  .strategy-position-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 22px; }
  .strategy-position h2 { max-width: 820px; margin-top: 8px; color: #f4f8fa; font-size: 27px; line-height: 1.22; letter-spacing: -0.025em; }
  .strategy-timeframe { flex: 0 0 auto; padding: 6px 9px; border: 1px solid rgba(57, 186, 230, 0.24); border-radius: 999px; color: #8bd8f2; background: rgba(57, 186, 230, 0.06); font: 10px/1.2 var(--font-mono); }
  .strategy-summary { max-width: 920px; margin-top: 15px; color: #c3d3dc; font-size: 15px; line-height: 1.72; }
  .position-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
  .position-signal { padding: 14px 15px; border: 1px solid rgba(85, 102, 120, 0.22); border-radius: 9px; background: rgba(8, 13, 19, 0.46); }
  .position-signal-label { color: #7f98a8; font: 9px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.8px; }
  .position-signal-value { margin-top: 7px; color: #d3dfe5; font-size: 12.5px; line-height: 1.58; }
  .strategy-section { padding: 24px; border: 1px solid var(--border); border-radius: 13px; background: linear-gradient(145deg, rgba(18, 24, 33, 0.96), rgba(11, 16, 23, 0.96)); }
  .strategy-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; margin-bottom: 16px; }
  .strategy-heading h2 { color: #f0f5f7; font-size: 20px; letter-spacing: -0.015em; }
  .strategy-heading p { max-width: 520px; color: var(--text-dim); font-size: 12px; line-height: 1.5; text-align: right; }
  .winning-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .winning-move { position: relative; padding: 18px; border: 1px solid rgba(255, 180, 84, 0.22); border-radius: 10px; background: rgba(255, 180, 84, 0.025); }
  .move-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .move-rank { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid rgba(255, 180, 84, 0.38); border-radius: 50%; color: var(--yellow); font: 11px/1 var(--font-mono); }
  .move-timeframe { color: #9aabb6; font: 9px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.55px; }
  .winning-move h3 { margin-top: 13px; color: #f1f5f7; font-size: 17px; line-height: 1.35; }
  .move-core { margin-top: 10px; color: #c4d2da; font-size: 13px; line-height: 1.62; }
  .move-why { margin-top: 11px; color: #91a8b7; font-size: 11.5px; line-height: 1.55; }
  .move-unlocks { margin: 13px 0 0; padding-left: 18px; color: #b8c988; font-size: 11.5px; line-height: 1.52; }
  .move-unlocks li + li { margin-top: 5px; }
  .move-bottom { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(85, 102, 120, 0.16); }
  .move-bottom p { color: #91a3ae; font-size: 11px; line-height: 1.5; }
  .move-bottom p + p { margin-top: 6px; }
  .move-bottom strong { color: #d8e2e7; }
  .leverage-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .leverage-card { padding: 17px; border: 1px solid rgba(194, 217, 76, 0.18); border-radius: 10px; background: rgba(194, 217, 76, 0.02); }
  .leverage-card h3 { color: #e8eff2; font-size: 15px; line-height: 1.38; }
  .leverage-insight { margin-top: 9px; color: #bfd0d8; font-size: 12.5px; line-height: 1.62; }
  .leverage-meaning { margin-top: 9px; color: #9fb179; font-size: 11.5px; line-height: 1.55; }
  .reasoning-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
  .reasoning-tag { padding: 3px 6px; border-radius: 4px; color: #718995; background: rgba(113, 144, 162, 0.07); font: 8px/1.25 var(--font-mono); text-transform: uppercase; letter-spacing: 0.35px; }
  .game-timeline { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .timeline-horizon { padding: 18px; border: 1px solid rgba(57, 186, 230, 0.18); border-radius: 10px; background: rgba(9, 15, 22, 0.62); }
  .timeline-meta { color: var(--accent); font: 9px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: 0.65px; }
  .timeline-horizon h3 { margin-top: 8px; color: #eef4f6; font-size: 17px; }
  .timeline-objective { margin-top: 7px; color: #b9cad3; font-size: 12px; line-height: 1.5; }
  .timeline-moves { margin: 12px 0 0; padding-left: 18px; color: #91a8b5; font-size: 11.5px; line-height: 1.5; }
  .timeline-moves li + li { margin-top: 5px; }
  .timeline-gate { margin-top: 13px; padding-top: 11px; border-top: 1px solid rgba(85, 102, 120, 0.17); color: #aebe82; font-size: 11px; line-height: 1.5; }
  .timeline-pivot { margin-top: 6px; color: #8b9da8; font-size: 10.5px; line-height: 1.5; }
  .pivot-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .pivot-signal { padding: 13px 14px; border: 1px solid rgba(85, 102, 120, 0.2); border-radius: 8px; background: rgba(9, 14, 20, 0.52); }
  .pivot-signal strong { color: #dce6ea; font-size: 12px; line-height: 1.45; }
  .pivot-signal p { margin-top: 5px; color: #8fa4b0; font-size: 11px; line-height: 1.5; }
  .strategy-provenance { padding: 13px 15px; border: 1px solid rgba(85, 102, 120, 0.17); border-radius: 9px; background: rgba(8, 12, 18, 0.5); color: #748a98; font-size: 10.5px; line-height: 1.55; }
  .strategy-provenance strong { color: #a9bbc5; }

  /* D3 TOOLTIP */
  .tooltip {
    position: absolute; text-align: center; padding: 6px 10px; font-size: 12px;
    background: #000; color: #fff; border: 1px solid var(--border); border-radius: 4px;
    pointer-events: none; opacity: 0; transition: opacity 0.2s; font-family: var(--font-mono);
  }

  @media (max-width: 900px) {
    body { padding: 28px 16px; }
    .winning-grid, .leverage-grid, .game-timeline { grid-template-columns: 1fr; }
    .position-grid, .pivot-list { grid-template-columns: 1fr; }
    .strategy-heading { align-items: flex-start; flex-direction: column; }
    .strategy-heading p { text-align: left; }
    .synthesis-columns { columns: 1; }
    .is-current .synth-body { grid-template-columns: 1fr; }
    .is-current .synth-section + .synth-section { border-left: 0; border-top: 1px solid rgba(85, 102, 120, 0.16); }
    .checkpoint-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .header { align-items: flex-start; gap: 18px; }
    .header-left h1 { font-size: 16px; }
    #graph-container { height: 520px; }
    .graph-legend { right: 10px; left: 10px; top: 10px; }
    .graph-outline { grid-template-columns: 1fr; }
    .strategy-position, .strategy-section { padding: 19px; }
    .strategy-position-head { flex-direction: column; }
    .strategy-position h2 { font-size: 22px; }
    .synth-header, .synth-section { padding-left: 18px; padding-right: 18px; }
    .synth-heading-row, .blueprint-heading-row { flex-direction: column; }
    .synth-badges { justify-content: flex-start; }
    .synth-text { font-size: 14px; }
    .blueprint-header { padding: 22px 18px; }
    .blueprint-title { font-size: 21px; }
    .blueprint-timeline { padding: 22px 14px; }
    .blueprint-timeline::before { left: 34px; }
    .blueprint-phase { grid-template-columns: 40px minmax(0, 1fr); gap: 9px; }
    .phase-head, .phase-decision, .phase-steps, .phase-gate { padding-left: 14px; padding-right: 14px; }
    .phase-meta { align-items: flex-start; flex-direction: column; gap: 5px; }
    .blueprint-checkpoints { padding: 0 14px 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>◆ AUGMENTED INTELLIGENCE</h1>
    <div class="subtitle" id="data-status">Live Graph Sync & Synthesis Engine</div>
  </div>
  <div class="header-right">
    <a href="/" class="btn-back">Return to Dashboard</a>
  </div>
</div>

<section aria-labelledby="graph-section-title">
  <h2 class="sr-only" id="graph-section-title">Mixture-of-Experts reasoning graph</h2>
  <div id="graph-container" role="region" aria-label="Interactive reasoning graph" aria-describedby="graph-outline-description"></div>
  <details class="graph-text-alternative">
    <summary>Accessible graph outline</summary>
    <div class="graph-outline" id="graph-outline-description"></div>
  </details>
</section>
<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<section class="strategy-board" aria-labelledby="strategy-section-title">
  <div class="section-title" id="strategy-section-title">Life Strategy Board // Winning Moves</div>
  <div id="life-strategy-container"></div>
</section>


<script>
  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function formatMathNotation(value) {
    const subscripts = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
    return String(value)
      .replace(/\\times/g, '×')
      .replace(/\\cdot/g, '·')
      .replace(/\\approx/g, '≈')
      .replace(/\\log/g, 'log')
      .replace(/\\(?:rightarrow|to)/g, '→')
      .replace(/\\leq?/g, '≤')
      .replace(/\\geq?/g, '≥')
      .replace(/_([0-9]+)/g, (_, digits) => [...digits].map(digit => subscripts[digit]).join(''));
  }

  function inlineMarkup(value) {
    let text = escapeHtml(value);
    const tokens = [];
    const hold = html => {
      const key = `\u0000RICH${tokens.length}\u0000`;
      tokens.push(html);
      return key;
    };

    text = text.replace(/`([^`\n]+)`/g, (_, code) => hold(`<code>${code}</code>`));
    text = text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, target, label) =>
      hold(`<span class="wiki-ref">${label || target}</span>`));
    text = text.replace(/\$([^$\n]+)\$/g, (_, formula) =>
      hold(`<span class="math-inline">${formatMathNotation(formula)}</span>`));
    text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    text = text.replace(/(^|[\s(>])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    text = text.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');

    tokens.forEach((html, index) => {
      text = text.replace(`\u0000RICH${index}\u0000`, html);
    });
    return text;
  }

  function formatRichText(value) {
    const source = String(value == null ? '' : value).replace(/\r\n?/g, '\n').trim();
    if (!source) return '';

    const output = [];
    const paragraph = [];
    let listType = '';
    let listStart = 1;
    let listItems = [];
    let inFence = false;
    let fenceLines = [];

    function flushParagraph() {
      if (!paragraph.length) return;
      output.push(`<p>${inlineMarkup(paragraph.join(' '))}</p>`);
      paragraph.length = 0;
    }

    function flushList() {
      if (!listType || !listItems.length) return;
      const start = listType === 'ol' && listStart !== 1 ? ` start="${listStart}"` : '';
      output.push(`<${listType}${start}>${listItems.map(item => `<li>${inlineMarkup(item)}</li>`).join('')}</${listType}>`);
      listType = '';
      listStart = 1;
      listItems = [];
    }

    function flushFence() {
      output.push(`<pre><code>${escapeHtml(fenceLines.join('\n'))}</code></pre>`);
      fenceLines = [];
    }

    source.split('\n').forEach(line => {
      if (/^\s*```/.test(line)) {
        if (inFence) flushFence();
        else {
          flushParagraph();
          flushList();
        }
        inFence = !inFence;
        return;
      }
      if (inFence) {
        fenceLines.push(line);
        return;
      }
      if (!line.trim()) {
        flushParagraph();
        flushList();
        return;
      }

      const heading = line.match(/^\s*#{2,6}\s+(.+)$/);
      if (heading) {
        flushParagraph();
        flushList();
        output.push(`<h4 class="rich-heading">${inlineMarkup(heading[1])}</h4>`);
        return;
      }

      const list = line.match(/^\s*(?:([-+*])|(\d+)\.)\s+(.+)$/);
      if (list) {
        flushParagraph();
        const nextType = list[2] ? 'ol' : 'ul';
        if (listType && listType !== nextType) flushList();
        if (!listType) {
          listType = nextType;
          listStart = list[2] ? Number(list[2]) : 1;
        }
        listItems.push(list[3]);
        return;
      }

      if (listType && /^\s{2,}\S/.test(line) && listItems.length) {
        listItems[listItems.length - 1] += ` ${line.trim()}`;
        return;
      }
      flushList();
      paragraph.push(line.trim());
    });

    if (inFence) flushFence();
    flushParagraph();
    flushList();
    return output.join('');
  }

  function renderModelChips(model) {
    return String(model || 'Unknown')
      .split(/\s*·\s*/)
      .filter(Boolean)
      .map(name => `<span class="model-chip">${escapeHtml(name)}</span>`)
      .join('');
  }

  function renderContextGuidance(synthesis) {
    const applications = Array.isArray(synthesis.context_applications) ? synthesis.context_applications : [];
    const decision = synthesis.context_decision || {};
    const actions = Array.isArray(synthesis.context_actions) ? synthesis.context_actions : [];
    if (!applications.length) return '';

    const applicationHtml = applications.map(item => {
      const refs = (item.source_refs || []).map(ref => `<span class="context-ref" title="${escapeHtml(ref)}">${escapeHtml(taskIdLabel(ref))}</span>`).join('');
      return `<article class="context-application">
        <div class="context-source">
          <h3 class="context-source-name">${escapeHtml(item.label)}</h3>
          <span class="context-source-type">${escapeHtml(item.source_type)}</span>
        </div>
        <div class="context-application-text">${escapeHtml(item.application)}</div>
        <div class="context-implication"><strong>Decision implication:</strong> ${escapeHtml(item.decision_implication)}</div>
        <div class="context-refs" aria-label="Outliner source references">${refs}</div>
      </article>`;
    }).join('');

    const decisionHtml = `<section class="context-decision" aria-label="Context-specific decision">
      <div class="context-decision-choice">${escapeHtml(decision.choice)}</div>
      <div class="context-decision-row"><strong>Why now:</strong> ${escapeHtml(decision.why)}</div>
      <div class="context-decision-row"><strong>Nearest alternative:</strong> ${escapeHtml(decision.alternative)}</div>
      <div class="context-decision-row"><strong>Review / reversal:</strong> ${escapeHtml(decision.review)}</div>
    </section>`;

    const actionHtml = actions.map(action => `<article class="context-action">
      <div class="context-action-head">
        <h4 class="context-action-title">${escapeHtml(action.label)} <span class="step-id" title="${escapeHtml(action.task_id)}">${escapeHtml(taskIdLabel(action.task_id))}</span></h4>
        <span class="context-state ${escapeHtml(action.state)}">${escapeHtml(action.state)}</span>
      </div>
      <div class="context-action-move">${escapeHtml(action.move)}</div>
      <div class="context-action-done"><strong>Evidence:</strong> ${escapeHtml(action.done_when)}</div>
    </article>`).join('');

    return `<section class="synth-context" aria-label="Applied to your Outliner">
      <div class="synth-label">Applied to your Outliner</div>
      <div class="context-grid">${applicationHtml}</div>
      ${decisionHtml}
      <div class="context-actions">${actionHtml}</div>
    </section>`;
  }

  function renderSyntheses(syntheses) {
    const container = document.getElementById('syntheses-container');
    container.innerHTML = '';
    const columns = document.createElement('div');
    columns.className = 'synthesis-columns';

    syntheses.forEach(s => {
      const card = document.createElement('article');
      card.className = `synthesis-card${s.is_current ? ' is-current' : ''}`;

      const badges = [];
      if (s.is_current) badges.push('Current');
      else if (s.status && s.status !== 'current') badges.push(s.status);
      if (s.confidence) badges.push(`${s.confidence} confidence`);
      const badgeHtml = badges.length
        ? `<div class="synth-badges">${badges.map(badge => `<span class="synth-badge">${escapeHtml(badge)}</span>`).join('')}</div>`
        : '';

      let html = `<div class="synth-header">
        <div class="synth-heading-row">
          <h2 class="synth-title">${escapeHtml(s.title)}</h2>
          ${badgeHtml}
        </div>
        <div class="synth-models">${renderModelChips(s.model)}</div>
      </div><div class="synth-body">`;

      if (s.problem) {
        html += `<section class="synth-section problem">
          <div class="synth-label">Observation / Constraint</div>
          <div class="synth-text">${formatRichText(s.problem)}</div>
        </section>`;
      }

      if (s.solution) {
        html += `<section class="synth-section solution">
          <div class="synth-label">Solution / Strategy</div>
          <div class="synth-text">${formatRichText(s.solution)}</div>
        </section>`;
      }

      html += `</div>${renderContextGuidance(s)}`;
      if (s.disagreement) {
        html += `<section class="synth-disagreement">
          <div class="synth-label">Expert disagreement / resolution</div>
          <div class="synth-text">${formatRichText(s.disagreement)}</div>
        </section>`;
      }
      card.innerHTML = html;
      (s.is_current ? container : columns).appendChild(card);
    });

    if (columns.childElementCount) container.appendChild(columns);
  }

  let augmentedActions = [];

  function taskIdLabel(taskId) {
    const value = String(taskId || '');
    return value.length > 12 ? `${value.slice(0, 8)}…` : value;
  }

  function renderBlueprint(blueprint) {
    const container = document.getElementById('blueprint-container');
    if (!blueprint || !Array.isArray(blueprint.phases)) {
      container.innerHTML = '<div class="blueprint"><div class="blueprint-header">Blueprint unavailable.</div></div>';
      return;
    }

    const actionMap = new Map(augmentedActions.map(action => [action.id, action]));
    const rules = (blueprint.operating_rules || [])
      .map(rule => `<span class="blueprint-rule">${escapeHtml(rule)}</span>`)
      .join('');

    const phases = blueprint.phases.map((phase, phaseIndex) => {
      const activeSteps = (phase.action_ids || [])
        .map(actionId => actionMap.get(actionId))
        .filter(Boolean)
        .map(action => ({
          label: action.label,
          task_id: action.task_id,
          detail: `${action.timebox} · First: ${action.first_step}`,
          done: action.done_when
        }));
      const queuedSteps = (phase.queue || []).map(item => ({
        label: item.label,
        task_id: item.task_id,
        detail: `Depends on: ${item.depends_on}`,
        done: 'Conditional queue item — it does not become active until this phase gate opens.'
      }));
      const steps = [...activeSteps, ...queuedSteps]
        .map((step, stepIndex) => `<div class="phase-step">
          <div class="step-order">${stepIndex + 1}</div>
          <div>
            <div class="step-title">${escapeHtml(step.label)} <span class="step-id" title="${escapeHtml(step.task_id)}">${escapeHtml(taskIdLabel(step.task_id))}</span></div>
            <div class="step-detail">${escapeHtml(step.detail)}</div>
            <div class="step-done">${escapeHtml(step.done)}</div>
          </div>
        </div>`).join('');

      return `<article class="blueprint-phase ${escapeHtml(phase.status || '')}">
        <div class="phase-index">0${phaseIndex + 1}</div>
        <div class="phase-card">
          <div class="phase-head">
            <div class="phase-meta">
              <span class="phase-horizon">${escapeHtml(phase.horizon)}</span>
              <span class="phase-status">${escapeHtml(phase.status)}</span>
            </div>
            <h3 class="phase-title">${escapeHtml(phase.title)}</h3>
            <div class="phase-window">${escapeHtml(phase.window)}</div>
          </div>
          <div class="phase-decision">${escapeHtml(phase.decision)}</div>
          <div class="phase-steps">${steps}</div>
          <div class="phase-gate"><strong>Gate</strong><br>${escapeHtml(phase.gate)}</div>
        </div>
      </article>`;
    }).join('');

    const checkpoints = (blueprint.checkpoints || []).map(checkpoint => `<article class="checkpoint">
      <div class="checkpoint-at">${escapeHtml(checkpoint.at)}</div>
      <div class="checkpoint-question">${escapeHtml(checkpoint.question)}</div>
      <div class="checkpoint-decision">Decision: ${escapeHtml(checkpoint.decision)}</div>
    </article>`).join('');

    container.innerHTML = `<div class="blueprint">
      <div class="blueprint-header">
        <div class="blueprint-heading-row">
          <div>
            <div class="blueprint-kicker">Mixture-of-Experts Game Plan</div>
            <h2 class="blueprint-title">${escapeHtml(blueprint.title)}</h2>
          </div>
          <div class="blueprint-timeframe">${escapeHtml(blueprint.timeframe)}</div>
        </div>
        <div class="blueprint-objective">${escapeHtml(blueprint.objective)}</div>
        <div class="blueprint-constraint"><strong>Current constraint:</strong> ${escapeHtml(blueprint.current_constraint)}</div>
        <div class="blueprint-rules">${rules}</div>
      </div>
      <div class="blueprint-timeline">${phases}</div>
      <div class="blueprint-checkpoints">
        <div class="checkpoint-title">Decision checkpoints</div>
        <div class="checkpoint-grid">${checkpoints}</div>
      </div>
    </div>`;
  }

  function renderLifeStrategy(strategy, nodes) {
    const container = document.getElementById('life-strategy-container');
    if (!strategy || !strategy.position) {
      container.innerHTML = '<div class="strategy-section">Life strategy unavailable.</div>';
      return;
    }

    const modelLabels = new Map((nodes || [])
      .filter(node => node.group === 'model')
      .map(node => [node.id, node.label]));
    const modelTags = ids => (ids || [])
      .map(id => `<span class="reasoning-tag">${escapeHtml(modelLabels.get(id) || id)}</span>`)
      .join('');
    const listItems = values => (values || []).map(value => `<li>${escapeHtml(value)}</li>`).join('');
    const position = strategy.position;

    const moves = (strategy.winning_moves || []).map(move => `<article class="winning-move">
      <div class="move-meta">
        <span class="move-rank" aria-label="Rank ${escapeHtml(move.rank)}">${escapeHtml(move.rank)}</span>
        <span class="move-timeframe">${escapeHtml(move.timeframe)}</span>
      </div>
      <h3>${escapeHtml(move.title)}</h3>
      <p class="move-core">${escapeHtml(move.move)}</p>
      <p class="move-why"><strong>Why this wins now:</strong> ${escapeHtml(move.why_now)}</p>
      <ul class="move-unlocks" aria-label="What this move unlocks">${listItems(move.unlocks)}</ul>
      <div class="move-bottom">
        <p><strong>Win:</strong> ${escapeHtml(move.win_condition)}</p>
        <p><strong>Tradeoff:</strong> ${escapeHtml(move.tradeoff)}</p>
      </div>
    </article>`).join('');

    const insights = (strategy.hidden_leverage || []).map(insight => `<article class="leverage-card">
      <h3>${escapeHtml(insight.title)}</h3>
      <p class="leverage-insight">${escapeHtml(insight.insight)}</p>
      <p class="leverage-meaning">${escapeHtml(insight.why_it_matters)}</p>
      <div class="reasoning-tags" aria-label="Reasoning models used">${modelTags(insight.model_ids)}</div>
    </article>`).join('');

    const timeline = (strategy.timeline || []).map(horizon => `<article class="timeline-horizon">
      <div class="timeline-meta">${escapeHtml(horizon.label)} · ${escapeHtml(horizon.window)}</div>
      <h3>${escapeHtml(horizon.objective)}</h3>
      <ul class="timeline-moves">${listItems(horizon.moves)}</ul>
      <p class="timeline-gate"><strong>Position won:</strong> ${escapeHtml(horizon.win_condition)}</p>
      <p class="timeline-pivot"><strong>Recalculate if:</strong> ${escapeHtml(horizon.pivot_if)}</p>
    </article>`).join('');

    const signals = (strategy.pivot_signals || []).map(signal => `<article class="pivot-signal">
      <strong>${escapeHtml(signal.signal)}</strong>
      <p>${escapeHtml(signal.meaning)} ${escapeHtml(signal.response)}</p>
    </article>`).join('');

    const provenance = strategy.reasoning_provenance || {};
    const fingerprint = String(provenance.wiki_fingerprint || 'unknown');
    container.innerHTML = `<div class="strategy-stack">
      <article class="strategy-position">
        <div class="strategy-position-head">
          <div>
            <div class="strategy-kicker">Your position</div>
            <h2>${escapeHtml(position.headline)}</h2>
          </div>
          <span class="strategy-timeframe">${escapeHtml(strategy.timeframe)}</span>
        </div>
        <p class="strategy-summary">${escapeHtml(position.summary)}</p>
        <div class="position-grid">
          <div class="position-signal"><div class="position-signal-label">Momentum</div><div class="position-signal-value">${escapeHtml(position.momentum)}</div></div>
          <div class="position-signal"><div class="position-signal-label">Central tension</div><div class="position-signal-value">${escapeHtml(position.tension)}</div></div>
          <div class="position-signal"><div class="position-signal-label">Highest leverage</div><div class="position-signal-value">${escapeHtml(position.leverage)}</div></div>
        </div>
      </article>

      <section class="strategy-section" aria-labelledby="winning-moves-title">
        <div class="strategy-heading">
          <h2 id="winning-moves-title">Winning Moves</h2>
          <p>Ranked choices that improve the whole board—not a longer list of tasks.</p>
        </div>
        <div class="winning-grid">${moves}</div>
      </section>

      <section class="strategy-section" aria-labelledby="hidden-leverage-title">
        <div class="strategy-heading">
          <h2 id="hidden-leverage-title">Hidden Leverage</h2>
          <p>Cross-life patterns that change what the best move is.</p>
        </div>
        <div class="leverage-grid">${insights}</div>
      </section>

      <section class="strategy-section" aria-labelledby="game-plan-title">
        <div class="strategy-heading">
          <h2 id="game-plan-title">Game Plan</h2>
          <p>Build the position across three horizons, with evidence that tells us when to change course.</p>
        </div>
        <div class="game-timeline">${timeline}</div>
      </section>

      <section class="strategy-section" aria-labelledby="pivot-signals-title">
        <div class="strategy-heading">
          <h2 id="pivot-signals-title">Pivot Signals</h2>
          <p>The board changes when these facts appear.</p>
        </div>
        <div class="pivot-list">${signals}</div>
      </section>

      <footer class="strategy-provenance">
        <strong>Reasoning, kept secondary:</strong> ${escapeHtml(provenance.summary)}
        Evidence: ${escapeHtml(provenance.evidence_scope)} · Wiki ${escapeHtml(fingerprint.slice(0, 12))}… · Confidence ${escapeHtml(position.confidence)}
        <div class="reasoning-tags" aria-label="All reasoning models used">${modelTags(provenance.model_ids)}</div>
      </footer>
    </div>`;
  }

  function renderGraphOutline(data) {
    const container = document.getElementById('graph-outline-description');
    container.replaceChildren();
    const order = ['evidence', 'model', 'expert', 'solution', 'decision', 'action', 'phase'];
    const relationCounts = new Map();
    (data.links || []).forEach(link => relationCounts.set(link.relation, (relationCounts.get(link.relation) || 0) + 1));
    const relations = document.createElement('p');
    relations.className = 'graph-outline-relations';
    relations.textContent = `Reasoning path: evidence → model → expert → solution → decision → action → phase. Relations: ${[...relationCounts.entries()].sort().map(([name, count]) => `${name} (${count})`).join(', ')}.`;
    container.appendChild(relations);

    order.forEach(group => {
      const rows = (data.nodes || []).filter(node => node.group === group);
      if (!rows.length) return;
      const section = document.createElement('section');
      section.className = 'graph-outline-group';
      const heading = document.createElement('h3');
      heading.textContent = `${group} (${rows.length})`;
      const list = document.createElement('ul');
      rows.forEach(node => {
        const item = document.createElement('li');
        item.textContent = node.summary ? `${node.label}: ${node.summary}` : node.label;
        list.appendChild(item);
      });
      section.append(heading, list);
      container.appendChild(section);
    });
  }

  function renderGraph(data) {
    const container = document.getElementById('graph-container');
    const width = container.clientWidth;
    const height = container.clientHeight;
    const groupStyles = {
      evidence: { color: '#ffb454', radius: 7, lane: 0.08 },
      model: { color: '#39bae6', radius: 10, lane: 0.25 },
      expert: { color: '#a78bfa', radius: 12, lane: 0.41 },
      solution: { color: '#c2d94c', radius: 11, lane: 0.58 },
      decision: { color: '#ff8f40', radius: 9, lane: 0.73 },
      action: { color: '#70d7a3', radius: 8, lane: 0.80 },
      phase: { color: '#f0f3f5', radius: 10, lane: 0.90 }
    };
    const styleFor = group => groupStyles[group] || { color: '#71808f', radius: 7, lane: 0.5 };

    d3.select("#graph-container").selectAll("svg").remove();
    container.querySelector('.graph-legend')?.remove();
    const legend = document.createElement('div');
    legend.className = 'graph-legend';
    legend.innerHTML = Object.entries(groupStyles)
      .map(([group, style]) => `<span class="graph-legend-item"><span class="graph-legend-dot" style="background:${style.color}"></span>${escapeHtml(group)}</span>`)
      .join('');
    container.appendChild(legend);

    const svg = d3.select("#graph-container")
      .append("svg")
      .attr("width", "100%")
      .attr("height", "100%")
      .attr("role", "group")
      .attr("aria-label", "Interactive left-to-right reasoning graph. Tab through nodes for details; use the accessible graph outline below for the complete textual alternative.")
      .call(d3.zoom().scaleExtent([0.45, 3]).on("zoom", function (event) {
         g.attr("transform", event.transform);
      }));

    const g = svg.append("g");
    const tooltip = d3.select("#tooltip");

    const byGroup = new Map();
    data.nodes.forEach(node => {
      if (!byGroup.has(node.group)) byGroup.set(node.group, []);
      byGroup.get(node.group).push(node);
    });
    byGroup.forEach(rows => {
      rows.sort((a, b) => String(a.label).localeCompare(String(b.label)));
      rows.forEach((node, index) => {
        node.laneY = 90 + ((index + 1) / (rows.length + 1)) * (height - 150);
      });
    });

    const simulation = d3.forceSimulation(data.nodes)
      .force("link", d3.forceLink(data.links).id(function (d) { return d.id; }).distance(88).strength(0.05))
      .force("charge", d3.forceManyBody().strength(-35))
      .force("x", d3.forceX(function (d) { return width * styleFor(d.group).lane; }).strength(0.92))
      .force("y", d3.forceY(function (d) { return d.laneY; }).strength(0.9))
      .force("collide", d3.forceCollide().radius(function (d) { return styleFor(d.group).radius + 12; }))
      .alphaDecay(0.045);

    const relationColors = {
      frames: '#6c7f92',
      equips: '#586c8a',
      derives: '#7d8f43',
      selects: '#875f44',
      governs: '#8a6f58',
      executes: '#49795f',
      scheduled_in: '#6e7881'
    };

    const link = g.append("g")
      .attr("stroke-opacity", 0.46)
      .attr("stroke-width", 1.2)
      .selectAll("line")
      .data(data.links)
      .join("line")
      .attr("stroke", function (d) { return relationColors[d.relation] || '#263546'; });

    const node = g.append("g")
      .attr("stroke", "#e8f0f4")
      .attr("stroke-width", 1.1)
      .selectAll("circle")
      .data(data.nodes)
      .join("circle")
      .attr("class", "graph-node")
      .attr("tabindex", 0)
      .attr("role", "img")
      .attr("aria-label", function (d) {
        return `${d.label || d.id}. Type: ${d.group}.${d.summary ? ` ${d.summary}` : ''}`;
      })
      .attr("r", function (d) { return styleFor(d.group).radius; })
      .attr("fill", function (d) { return styleFor(d.group).color; })
      .call(drag(simulation));

    const labeledNodes = data.nodes.filter(function (d) {
      return d.group !== 'action' || d.queue_state === 'active-controller';
    });
    const label = g.append("g")
      .selectAll("text")
      .data(labeledNodes)
      .join("text")
      .attr("class", "graph-label")
      .text(function (d) { return d.graph_label || d.label || d.id; })
      .attr("font-size", function (d) { return d.group === 'expert' || d.group === 'solution' ? '10px' : '9px'; })
      .attr("fill", "#aebfca")
      .attr("text-anchor", "start")
      .attr("dx", function (d) { return styleFor(d.group).radius + 5; })
      .attr("dy", function (d) {
        if (d.group === 'action') return 5 + (Number(d.order) || 1) * 7;
        return { evidence: -7, model: 4, expert: -8, solution: 10, decision: -8, phase: 3 }[d.group] || 3;
      })
      .style("pointer-events", "none");

    function showNodeTooltip(target, d, pageX, pageY) {
      const summary = d.summary ? `<br><span style="color:#9aabb6">${escapeHtml(d.summary)}</span>` : '';
      tooltip.style("opacity", 1)
             .html(`<b>${escapeHtml(d.label || d.id)}</b><br>Type: ${escapeHtml(d.group)}${summary}`)
             .style("max-width", "340px")
             .style("text-align", "left")
             .style("left", (pageX + 10) + "px")
             .style("top", (pageY - 28) + "px");
      d3.select(target).attr("stroke", "var(--yellow)").attr("stroke-width", 3);
    }

    function hideNodeTooltip(target) {
      tooltip.style("opacity", 0);
      d3.select(target).attr("stroke", "#e8f0f4").attr("stroke-width", 1.1);
    }

    node.on("mouseover", function (event, d) {
      showNodeTooltip(event.currentTarget, d, event.pageX, event.pageY);
    })
    .on("mouseout", function (event) {
      if (document.activeElement !== event.currentTarget) hideNodeTooltip(event.currentTarget);
    })
    .on("focus", function (event, d) {
      const bounds = event.currentTarget.getBoundingClientRect();
      showNodeTooltip(event.currentTarget, d, bounds.right + window.scrollX, bounds.top + window.scrollY);
    })
    .on("blur", function (event) {
      hideNodeTooltip(event.currentTarget);
    })
    .on("keydown", function (event, d) {
      if (event.key === 'Escape') {
        hideNodeTooltip(event.currentTarget);
        event.currentTarget.blur();
      } else if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        const bounds = event.currentTarget.getBoundingClientRect();
        showNodeTooltip(event.currentTarget, d, bounds.right + window.scrollX, bounds.top + window.scrollY);
      }
    });

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);
      node
        .attr("cx", d => d.x)
        .attr("cy", d => d.y);
      label
        .attr("x", d => d.x)
        .attr("y", d => d.y);
    });

    function drag(simulation) {
      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }
      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }
      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
      return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
    }
  }

  async function init() {
    try {
      const res = await fetch('/api/augmented-graph');
      if (!res.ok) throw new Error('API Error');
      const data = await res.json();
      renderGraphOutline(data);
      renderGraph(data);
      renderLifeStrategy(data.life_strategy, data.nodes || []);
      const method = data.meta?.method ? ` · ${data.meta.method}` : '';
      document.getElementById('data-status').innerText = `Graph loaded: ${data.nodes.length} nodes, ${data.links.length} reasoning links${method}`;
    } catch(e) {
      document.getElementById('graph-container').innerHTML = `<div style="padding:40px;text-align:center;color:var(--red);">Error loading graph data.</div>`;
      document.getElementById('data-status').innerText = 'Offline';
    }
  }

  init();
</script>
</body>
</html>
